name: Deploy to Cloudflare

# This is the one that actually publishes https://cju.media. The Worker
# (cju-media) serves the Eleventy build output as static assets -- see
# wrangler.jsonc. Note that pages_deployment.yml does NOT touch the live
# site; it only publishes the repo to cju-media.github.io so the
# av-events dashboard stays reachable. Before this workflow existed the
# live deploy was a manual `npx wrangler deploy`, so a green check on
# main could (and did) mean the site was still serving stale content.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two deploys at once, and never cancel one midway -- a
# half-finished asset upload would leave the Worker in a mixed state.
concurrency:
  group: "cloudflare-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Fail here with a readable message rather than letting wrangler
      # exit on an empty token several minutes in.
      - name: Check deploy credentials
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Create a Cloudflare API token with the 'Edit Cloudflare Workers' template, then add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # wrangler is pinned in package.json and installed by `npm ci`
      # above, so this deploys the same version used locally rather than
      # whatever `npx wrangler` happens to resolve to that day.
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.131.2'
