name: Process AV Events Queue

on:
  push:
    paths:
      - 'av-events/uploads_queue/**'
  workflow_dispatch:

permissions:
  contents: write

# Uploads from the phone dashboard land as several individual commits in a
# row (one per photo, then meta.json last) -- each push triggers this
# workflow, so runs must not race each other's commit/push.
concurrency:
  group: process-av-events
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process queue
        run: python3 av-events/process_events_queue.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # git add on a path that no longer exists (e.g. the queue dir once
          # every submission in it has been drained) is a hard failure, not
          # a no-op -- guard against that normal end state.
          if [ -d "av-events/uploads_queue" ]; then
            git add av-events/uploads_queue/
          fi
          git add av-events/images/ av-events/events.json
          git diff --staged --quiet || git commit -m "Process AV events upload queue"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
