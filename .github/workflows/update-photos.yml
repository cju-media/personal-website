name: Update iCloud Photos

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'personal/photos/fetch_icloud_photos.py'
      - '.github/workflows/update-photos.yml'

jobs:
  update-photos:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Fetch Photos from iCloud
        run: |
          python3 personal/photos/fetch_icloud_photos.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: Update photos from iCloud Shared Album"
          file_pattern: "personal/photos/images/* personal/photos/photos.json"
          branch: main
