  <script>
    if (typeof Squarespace === 'undefined') {
        var Squarespace = { onInitialize: (Y, init) => { window.addEventListener('load', init); } };
        var Y = null;
    }

    Squarespace.onInitialize(Y, init1)

    function init1() {
        // --- TITLE ANIMATION LOGIC ---
        const fontClasses = ['font1', 'font2', 'font3', 'font4', 'font5', 'font6'];
        const colors = ['#2F4F4F', '#4B0082', '#8B0000', '#000080', '#556B2F', '#8B4513', '#2E0854', '#191970'];
        const katakanaMap = {
            'A': 'ア', 'B': 'ブ', 'C': 'ク', 'D': 'デ', 'E': 'エ',
            'F': 'フ', 'G': 'グ', 'H': 'ハ', 'I': 'イ', 'J': 'ジ',
            'K': 'ケ', 'L': 'ル', 'M': 'ム', 'N': 'ン', 'O': 'オ',
            'P': 'プ', 'Q': 'キュ', 'R': 'ラ', 'S': 'ス', 'T': 'ト',
            'U': '牛', 'V': 'ヴ', 'W': 'ワ', 'X': 'クス', 'Y': 'ヤ', 'Z': 'ズ'
        };

        function changeFontRandomly(span) {
            if (!span.dataset.original) {
                span.dataset.original = span.innerText;
            }
            fontClasses.forEach(fontClass => span.classList.remove(fontClass));
            const randomIndex = Math.floor(Math.random() * fontClasses.length);
            span.classList.add(fontClasses[randomIndex]);

            if (Math.random() < 0.05) {
                const originalChar = span.dataset.original.toUpperCase();
                if (katakanaMap[originalChar]) {
                    span.innerText = katakanaMap[originalChar];
                }
            } else {
                span.innerText = span.dataset.original;
            }

            const interval = Math.floor(Math.random() * (700 - 300 + 1)) + 300;
            setTimeout(() => changeFontRandomly(span), interval);
        }

        function changeColorRandomly(span) {
            const randomColorIndex = Math.floor(Math.random() * colors.length);
            span.style.color = colors[randomColorIndex];
            const interval = Math.floor(Math.random() * (1500 - 800 + 1)) + 800;
            setTimeout(() => changeColorRandomly(span), interval);
        }

        const spans = document.querySelectorAll('.text-block1 .span-class');
        spans.forEach(span => {
            changeFontRandomly(span);
            changeColorRandomly(span);
        });

     var videos = [
        "https://www.cameronjohnston.xyz/s/yt5sio-args-piece-for-processed-algorthmic-piano-and-video-1080p.mp4",
        "https://www.cameronjohnston.xyz/s/Screen-Recording-2023-01-26-at-11152-PM-HD-1080p-H264-Proxy-half-size.mov",
        "https://www.cameronjohnston.xyz/s/Screen-Recording-2023-01-30-at-13338-PM.mov",
        "https://cameron-johnston-6skl.squarespace.com/s/visuals2-H264-Proxy-half-size.mov",
             "https://cameron-johnston-6skl.squarespace.com/s/Demon-Visuals-copy-H264-Proxy-half-size.mov",
             "https://cameron-johnston-6skl.squarespace.com/s/rainbow-H264-Proxy-half-size.mov",
       'https://www.cameronjohnston.xyz/s/Reel-1.mov',
       'https://www.cameronjohnston.xyz/s/Reel-3.mov',
         'https://www.cameronjohnston.xyz/s/Reel-2.mov'

      ]

      document.getElementsByTagName('video')[0].volume = 0

      // Fisher-Yates shuffle
      for (let i = videos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [videos[i], videos[j]] = [videos[j], videos[i]];
      }

      var video = videos[0]
      var myVideo = document.getElementById("myVideo")
      myVideo.src = video

      var video2 = videos[1]
      var myVideo2 = document.getElementById("myVideo2")
      myVideo2.src = video2

      var video3 = videos[2]
      var myVideo3 = document.getElementById("myVideo3")
      myVideo3.src = video3

      var video4 = videos[3]
      var myVideo4 = document.getElementById("myVideo4")
      myVideo4.src = video4

      // --- FLY-IN ANIMATION LOGIC ---
      const videoElements = [myVideo, myVideo2, myVideo3, myVideo4];

      // 1. Initial State: Scatter
      videoElements.forEach(v => {
          v.classList.add('fly-in-element');

          const randomX = (Math.random() - 0.5) * 2000;
          const randomY = (Math.random() - 0.5) * 2000;
          const randomRotate = (Math.random() - 0.5) * 180;

          // Apply initial state
          v.style.transform = `translate(${randomX}px, ${randomY}px) rotate(${randomRotate}deg)`;
          v.style.opacity = "0";
      });

      // 2. Shuffle Order for Landing
      const shuffledVideos = [...videoElements];
      for (let i = shuffledVideos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledVideos[i], shuffledVideos[j]] = [shuffledVideos[j], shuffledVideos[i]];
      }

      // 3. Trigger Landing with Stagger
      // Force reflow to ensure initial state is rendered
      void document.body.offsetWidth;

      shuffledVideos.forEach((v, index) => {
          setTimeout(() => {
              v.classList.add('fly-in-landed');
              // Clear inline transform so CSS class takes over
              v.style.transform = '';
          }, index * 500 + 100); // 500ms stagger
      });



      videoElements.forEach(v => {
        v.addEventListener("loadedmetadata", function () {
          console.log(v.duration)
          v.muted = true
          if (v.autoplay) {
            v.play()
            v.controls = false
          } else {
            v.controls = true
          }
          v.loop = true
        })
      })
    }
  </script>

    body {

    /* Animation Classes */
    .fly-in-element {
        will-change: transform, opacity;

    }

    .fly-in-landed {
        opacity: 1 !important;
        transform: translate(0, 0) rotate(0deg) !important;
    }

          video::-webkit-media-controls {
  display: none;
}

    #myVideo {

    #myVideo2 {
      width: 50%;
      height: 51vh;
      scale: 1 1.01;

      border-radius: 0 10px 0 0;
    }

    #myVideo3 {
      width: 50%;
      height: 50vh;
      border-radius: 0 0 0 10px;
    }

    #myVideo4 {
      width: 50%;
      height: 51vh;
      scale: 1 1.01;
      /* transform removed for flex layout */
      border-radius: 0 0 10px 0;

    /* New CSS for scaling to 16:9 aspect ratio */
    video {
      object-fit: cover;
      width: 50vw;

    }

    @media (max-aspect-ratio: 16/9) {
      video {
/*         height: 50vh;
        width: 89.0625vh; */
        width: 50vw;
        height: fill;
      }
    }

    @media (min-aspect-ratio: 16/9) {
      video {
        width: 50vw;
        height: fill;
      }
    }
  </style>
