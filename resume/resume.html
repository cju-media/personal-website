<style>
  .resume-view-container { 
    font-family: sans-serif; 
    text-align: center; 
    width: 100%;
    margin: 0 auto;
  }

  /* The Wrapper handles the scaling math */
  .pdf-wrapper {
    width: 100%;
    height: 80vh;
    overflow: hidden;
    position: relative;
    border: 1px solid #ddd;
    border-radius: 4px;
    background: #f4f4f4;
  }

  .pdf-frame { 
    /* We make the iframe larger than the container, then scale it down 
       to 'zoom' the content if needed. For 1:1 fit, use these settings: */
    width: 100%;
    height: 100%;
    border: none;
    
    /* Some browsers ignore FitH but respect zoom CSS */
    zoom: 1; 
    -moz-transform: scale(1); 
    -o-transform: scale(1); 
    -webkit-transform: scale(1);
    transform: scale(1);
    transform-origin: 0 0;
  }

  .download-btn { 
    display: inline-block; 
    margin: 15px 0;
    padding: 12px 24px; 
    background: #000; 
    color: #fff; 
    text-decoration: none; 
    border-radius: 4px;
    font-weight: bold;
  }
</style>

<div class="resume-view-container">
  <div class="pdf-wrapper">
    <iframe id="live-pdf" class="pdf-frame" src=""></iframe>
  </div>
  <a id="download-link" class="download-btn" href="#" target="_blank">Open PDF in New Tab</a>
</div>

<script>
  (function() {
    const iframe = document.getElementById('live-pdf');
    const downloadLink = document.getElementById('download-link');
    const baseUrl = "https://raw.githack.com/cju-media/personal-website/main/resume/resume.pdf";

    function updateIframe() {
      // 1. Generate a new timestamp for every single resize event
      const resizeTick = new Date().getTime();
      
      // 2. Determine fit mode based on orientation
      const viewMode = "#view=Fit";
      
      // 3. Update the source with a unique URL to FORCE the reload
      const finalUrl = `${baseUrl}?v=${resizeTick}${viewMode}`;
      
      iframe.src = finalUrl;
      downloadLink.href = baseUrl + "?v=" + resizeTick;
      
      console.log("PDF reloaded for new window size: " + viewMode);
    }

    // Initial load
    updateIframe();

    // Listen for resize/orientation changes
    let resizeTimer;
    let lastWidth = window.innerWidth;

    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        // Optimization: Only reload if the width actually changed 
        // (prevents annoying reloads when mobile address bars hide/show)
        if (window.innerWidth !== lastWidth) {
          lastWidth = window.innerWidth;
          updateIframe();
        }
      }, 300); // 300ms delay ensures the window has finished snapping to its new size
    });
  })();
</script>
