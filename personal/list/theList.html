<style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display&family=VT323&display=swap');

    #the-list-page-wrapper {
        font-family: sans-serif;
        padding: 20px;
        max-width: 800px;
        margin: 0 auto;
        color: #333;
    }

    #the-list-page-wrapper .font1 { font-family: Arial, sans-serif; }
    #the-list-page-wrapper .font2 { font-family: Times New Roman, serif; }
    #the-list-page-wrapper .font3 { font-family: Courier New, monospace; }
    #the-list-page-wrapper .font4 { font-family: essay-text, monospace; }
    #the-list-page-wrapper .font5 { font-family: 'Playfair Display', serif; }
    #the-list-page-wrapper .font6 { font-family: 'VT323', monospace; transform: scale(1.1); }

    #the-list-page-wrapper h1 {
        font-size: calc(2.5vw + 20px);
        text-align: center;
        margin-bottom: 40px;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
    }

    #the-list-page-wrapper .glitch-span {
        display: inline-block;
        width: 0.8em;
        text-align: center;
        vertical-align: bottom;
        line-height: 1.2;
    }

    #the-list-content {
        line-height: 1.6;
        font-size: 1.1rem;
    }

    #the-list-content a {
        color: #0000EE !important;
        text-decoration: underline !important;
    }

    #the-list-content .list-highlight {
        font-weight: bold;
        color: #000;
        /* Custom decoration for ++ syntax */
    }
</style>

<div id="the-list-page-wrapper">
    <h1>
        <span class="glitch-span">T</span>
        <span class="glitch-span">H</span>
        <span class="glitch-span">E</span>
        <span class="glitch-span" style="width: 0.5em;">&nbsp;</span>
        <span class="glitch-span">L</span>
        <span class="glitch-span">I</span>
        <span class="glitch-span">S</span>
        <span class="glitch-span">T</span>
    </h1>

    <div id="the-list-content">
        Loading...
    </div>
</div>

<script>
(function() {
    function initTheList() {
        // --- Glitch Logic ---
        const fontClasses = ['font1', 'font2', 'font3', 'font4', 'font5', 'font6'];
        const colors = ['#2F4F4F', '#4B0082', '#8B0000', '#000080', '#556B2F', '#8B4513', '#2E0854', '#191970'];
        const katakanaMap = {
            'A': 'ア', 'B': 'ブ', 'C': 'ク', 'D': 'デ', 'E': 'エ',
            'F': 'フ', 'G': 'グ', 'H': 'ハ', 'I': 'イ', 'J': 'ジ',
            'K': 'ケ', 'L': 'ル', 'M': 'ム', 'N': 'ン', 'O': 'オ',
            'P': 'プ', 'Q': 'キュ', 'R': 'ラ', 'S': 'ス', 'T': 'ト',
            'U': '牛', 'V': 'ヴ', 'W': 'ワ', 'X': 'クス', 'Y': 'ヤ', 'Z': 'ズ'
        };

        const wrapper = document.getElementById('the-list-page-wrapper');
        if (!wrapper) return;

        function changeFontRandomly(span) {
            if (!span.dataset.original) {
                span.dataset.original = span.innerText;
            }
            // Skip spaces
            if (!span.innerText.trim()) return;

            fontClasses.forEach(fontClass => span.classList.remove(fontClass));
            const randomIndex = Math.floor(Math.random() * fontClasses.length);
            span.classList.add(fontClasses[randomIndex]);

            if (Math.random() < 0.05) {
                const originalChar = span.dataset.original.toUpperCase();
                if (katakanaMap[originalChar]) {
                    span.innerText = katakanaMap[originalChar];
                }
            } else {
                span.innerText = span.dataset.original;
            }

            const interval = Math.floor(Math.random() * (700 - 300 + 1)) + 300;
            setTimeout(() => changeFontRandomly(span), interval);
        }

        function changeColorRandomly(span) {
            if (!span.innerText.trim()) return;
            const randomColorIndex = Math.floor(Math.random() * colors.length);
            span.style.color = colors[randomColorIndex];
            const interval = Math.floor(Math.random() * (1500 - 800 + 1)) + 800;
            setTimeout(() => changeColorRandomly(span), interval);
        }

        const spans = wrapper.querySelectorAll('.glitch-span');
        spans.forEach(span => {
            changeFontRandomly(span);
            changeColorRandomly(span);
        });

        // --- Markdown Loading Logic ---
        const contentDiv = document.getElementById('the-list-content');
        const markdownUrl = 'https://raw.githubusercontent.com/cju-media/personal-website/main/personal/list/list.md';

        function loadMarked(callback) {
            if (window.marked) {
                callback();
                return;
            }
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
            script.onload = callback;
            document.head.appendChild(script);
        }

        function parseCustomSyntax(markdown) {
            // Remove the title from markdown if it exists, since we have our own header
            // "The List" is the first line usually.
            let cleanMd = markdown.replace(/^#\s+The List\s*$/m, '');

            // Replace ++text++ with <span class="list-highlight">text</span>
            // Note: This regex might need adjustment if ++ wraps newlines
            cleanMd = cleanMd.replace(/\+\+(.*?)\+\+/gs, '<span class="list-highlight">$1</span>');
            return cleanMd;
        }

        function fetchAndRender() {
            fetch(markdownUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.text();
                })
                .then(text => {
                    const processedMarkdown = parseCustomSyntax(text);
                    contentDiv.innerHTML = marked.parse(processedMarkdown);
                })
                .catch(error => {
                    console.error('Error loading The List:', error);
                    contentDiv.innerHTML = '<p>Error loading content.</p>';
                });
        }

        loadMarked(fetchAndRender);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initTheList);
    } else {
        initTheList();
    }
})();
</script>
