<div id="the-list-page-wrapper">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display&family=VT323&display=swap');

        /* Scoped Styles */
        #the-list-page-wrapper {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: auto;
            margin: 0;
            background-color: transparent; /* Inherit from Squarespace */
            padding: 20px 20px 20px 20px;
            box-sizing: border-box;
            width: 100%;
        }

        /* Glitch font classes */
        #the-list-page-wrapper .font1 { font-family: Arial, sans-serif !important; }
        #the-list-page-wrapper .font2 { font-family: Times New Roman, serif !important; }
        #the-list-page-wrapper .font3 { font-family: Courier New, monospace !important; }
        #the-list-page-wrapper .font4 { font-family: essay-text, monospace !important; }
        #the-list-page-wrapper .font5 { font-family: 'Playfair Display', serif !important; }
        #the-list-page-wrapper .font6 { font-family: 'VT323', monospace !important; transform: scale(1.1); }

        #the-list-page-wrapper h1.glitch-title {
            font-size: min(5vw, 3rem);
            text-align: center;
            display: flex;
            justify-content: center;
            flex-wrap: nowrap;
            margin-bottom: 40px;
            margin-top: 0;
            color: inherit;
        }

        #the-list-page-wrapper .span-class {
            display: inline-block;
            width: 1.2em;
            text-align: center;
            vertical-align: bottom;
            line-height: 1.2;
        }

        /* Content Styles */
        #the-list-page-wrapper #list-content {
            width: 100%;
            max-width: 800px;
            text-align: left;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        #the-list-page-wrapper #list-content ul {
            list-style-type: none;
            padding-left: 0;
        }

        #the-list-page-wrapper #list-content li {
            margin-bottom: 10px;
            padding-left: 20px;
            position: relative;
        }

        #the-list-page-wrapper #list-content li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #333;
        }

        /* Checkbox styling from markdown */
        #the-list-page-wrapper input[type="checkbox"] {
            margin-right: 10px;
        }

        #the-list-page-wrapper .loading {
            font-family: monospace;
            color: #666;
            font-size: 1.2rem;
            text-align: center;
            margin-top: 20px;
        }

        /* Hyperlink styling */
        #the-list-page-wrapper a {
            color: blue !important;
            text-decoration: underline;
        }
    </style>

    <h1 class="glitch-title">
        <span class="span-class">T</span>
        <span class="span-class">H</span>
        <span class="span-class">E</span>
        <span class="span-class" style="width: 0.5em;">&nbsp;</span>
        <span class="span-class">L</span>
        <span class="span-class">I</span>
        <span class="span-class">S</span>
        <span class="span-class">T</span>
    </h1>

    <div id="list-content">
        <div class="loading">Loading list...</div>
    </div>

    <script>
        (function() {
            function initTheList() {
                // Prevent double initialization
                if (window.theListInitialized) return;
                window.theListInitialized = true;

                const wrapper = document.getElementById('the-list-page-wrapper');
                if (!wrapper) return;

                // Glitch Logic
                const Glitch = {
                    fontClasses: ['font1', 'font2', 'font3', 'font4', 'font5', 'font6'],
                    colors: ['#2F4F4F', '#4B0082', '#8B0000', '#000080', '#556B2F', '#8B4513', '#2E0854', '#191970'],
                    katakanaMap: {
                        'A': 'ア', 'B': 'ブ', 'C': 'ク', 'D': 'デ', 'E': 'エ',
                        'F': 'フ', 'G': 'グ', 'H': 'ハ', 'I': 'イ', 'J': 'ジ',
                        'K': 'ケ', 'L': 'ル', 'M': 'ム', 'N': 'ン', 'O': 'オ',
                        'P': 'プ', 'Q': 'キュ', 'R': 'ラ', 'S': 'ス', 'T': 'ト',
                        'U': '牛', 'V': 'ヴ', 'W': 'ワ', 'X': 'ク', 'Y': 'ヤ', 'Z': 'ズ'
                    },

                    start(span) {
                        if (!span.dataset.original) {
                            span.dataset.original = span.innerText;
                        }
                        this.loopFont(span);
                        this.loopColor(span);
                    },

                    loopFont(span) {
                        const tick = () => {
                            this.fontClasses.forEach(fontClass => span.classList.remove(fontClass));
                            const randomIndex = Math.floor(Math.random() * this.fontClasses.length);
                            span.classList.add(this.fontClasses[randomIndex]);

                            if (Math.random() < 0.05) {
                                const originalChar = span.dataset.original.toUpperCase();
                                if (this.katakanaMap[originalChar]) {
                                    span.innerText = this.katakanaMap[originalChar];
                                }
                            } else {
                                span.innerText = span.dataset.original;
                            }

                            const interval = Math.floor(Math.random() * (700 - 300 + 1)) + 300;
                            setTimeout(tick, interval);
                        };
                        tick();
                    },

                    loopColor(span) {
                        const tick = () => {
                            const randomColorIndex = Math.floor(Math.random() * this.colors.length);
                            span.style.color = this.colors[randomColorIndex];
                            const interval = Math.floor(Math.random() * (1500 - 800 + 1)) + 800;
                            setTimeout(tick, interval);
                        };
                        tick();
                    }
                };

                // Initialize Title Glitch
                const titleSpans = wrapper.querySelectorAll('.glitch-title .span-class');
                titleSpans.forEach(span => {
                    if (span.innerHTML === '&nbsp;') return;
                    Glitch.start(span);
                });

                // Load Marked.js and Fetch Content
                const contentContainer = wrapper.querySelector('#list-content');
                const listUrl = 'https://raw.githubusercontent.com/cju-media/personal-website/main/personal/list/list.md';

                function loadMarked(callback) {
                    if (window.marked) {
                        callback();
                        return;
                    }
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
                    script.onload = callback;
                    script.onerror = () => {
                        contentContainer.innerHTML = '<div class="loading" style="color: red;">Error loading markdown parser.</div>';
                    };
                    document.head.appendChild(script);
                }

                function fetchAndRenderList() {
                    fetch(listUrl)
                        .then(response => {
                            if (!response.ok) throw new Error("Network response was not ok");
                            return response.text();
                        })
                        .then(markdown => {
                            // Simple text glitch support: ++text++
                            // We can use a custom renderer or just replace after parsing
                            // Let's rely on standard markdown for now as per request.
                            // However, we need to remove the title from markdown if we are displaying it separately
                            // Or keep it. The user's list.md has "# THE LIST"

                            // Let's strip the first H1 if it matches "THE LIST" to avoid duplication
                            let md = markdown;
                            // Regex to remove '# THE LIST' at start
                            md = md.replace(/^#\s*THE LIST\s*/i, '');

                            contentContainer.innerHTML = marked.parse(md);
                        })
                        .catch(error => {
                            console.error('Error loading list:', error);
                            contentContainer.innerHTML = '<div class="loading" style="color: red;">Error loading list content.</div>';
                        });
                }

                loadMarked(fetchAndRenderList);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initTheList);
            } else {
                initTheList();
            }
        })();
    </script>
</div>
