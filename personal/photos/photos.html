<div id="personal-photos-wrapper">
    <div class="header-container">
        <h1>
            <span class="glitch-char">P</span>
            <span class="glitch-char">H</span>
            <span class="glitch-char">O</span>
            <span class="glitch-char">T</span>
            <span class="glitch-char">O</span>
            <span class="glitch-char">S</span>
        </h1>
    </div>

    <div class="controls-container">
        <div class="control-group">
            <label for="sort-select">Sort by:</label>
            <select id="sort-select" class="sort-select">
                <option value="random">Random</option>
                <option value="date-desc">Date Added (Newest)</option>
                <option value="date-asc">Date Added (Oldest)</option>
            </select>
        </div>
        <a href="https://www.icloud.com/sharedalbum/#B2N5n8hH4Gdkz1m" target="_blank" rel="noopener noreferrer" class="icloud-button">
            View on iCloud
        </a>
    </div>

    <div id="loading-message">Loading photos...</div>
    <div id="photos-grid" class="photos-grid">
        <!-- Photos will be injected here -->
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox-modal" class="lightbox">
        <span class="close-btn">&times;</span>
        <div class="lightbox-content">
            <div id="lightbox-spinner" class="spinner"></div>
            <img id="lightbox-img" src="" alt="Full view" style="display:none;">
            <video id="lightbox-video" controls style="display:none;"></video>
            <div id="lightbox-caption" class="caption"></div>
        </div>
    </div>
</div>

<style>
    /* Scoped Styles */
    #personal-photos-wrapper {
        font-family: 'Courier New', Courier, monospace;
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
        color: #333;
    }

    #loading-message {
        text-align: center;
        margin-top: 20px;
        font-style: italic;
        color: #666;
    }

    /* Glitch Title Styles */
    #personal-photos-wrapper h1 {
        text-align: center;
        font-size: 3rem;
        margin-bottom: 40px;
        letter-spacing: 0.2em;
        font-weight: normal;
    }

    #personal-photos-wrapper .glitch-char {
        display: inline-block;
        width: 0.8em;
        text-align: center;
        vertical-align: bottom;
    }

    /* Controls */
    #personal-photos-wrapper .controls-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-bottom: 30px;
        flex-wrap: wrap;
    }

    #personal-photos-wrapper .control-group {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 0.9rem;
        color: #333;
    }

    #personal-photos-wrapper .sort-select {
        padding: 8px 12px;
        border-radius: 15px;
        border: 1px solid #ccc;
        background-color: white;
        font-family: inherit;
        font-size: inherit;
        outline: none;
        cursor: pointer;
    }

    #personal-photos-wrapper .icloud-button {
        display: inline-block;
        padding: 8px 20px;
        background-color: #007aff;
        color: white;
        text-decoration: none;
        border-radius: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 0.9rem;
        transition: background-color 0.2s;
    }

    #personal-photos-wrapper .icloud-button:hover {
        background-color: #0056b3;
    }

    /* Grid Layout */
    #personal-photos-wrapper .photos-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
    }

    #personal-photos-wrapper .photo-item {
        position: relative;
        overflow: hidden;
        aspect-ratio: 1 / 1;
        cursor: pointer;
        border: 1px solid #ddd;
        transition: transform 0.2s;
        background-color: #f9f9f9;
    }

    #personal-photos-wrapper .photo-item:hover {
        transform: scale(1.02);
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    #personal-photos-wrapper .photo-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        opacity: 0;
        transition: opacity 0.5s ease-in;
    }

    #personal-photos-wrapper .photo-item img.loaded {
        opacity: 1;
    }

    #personal-photos-wrapper .video-indicator {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 3rem;
        color: white;
        text-shadow: 0 0 10px rgba(0,0,0,0.5);
        pointer-events: none;
    }

    /* Lightbox Styles */
    #personal-photos-wrapper .lightbox {
        display: none;
        position: fixed;
        z-index: 9999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.9);
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    #personal-photos-wrapper .lightbox.active {
        display: flex;
    }

    #personal-photos-wrapper .lightbox-content {
        max-width: 90%;
        max-height: 80vh;
        position: relative;
    }

    #personal-photos-wrapper .lightbox-content img,
    #personal-photos-wrapper .lightbox-content video {
        max-width: 100%;
        max-height: 80vh;
        display: block;
        margin: 0 auto;
        border: 2px solid white;
        box-sizing: border-box; /* Include border in dimensions */
    }

    /* Spinner */
    #personal-photos-wrapper .spinner {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 4px solid #fff;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
        display: none;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    #personal-photos-wrapper .close-btn {
        position: absolute;
        top: 20px;
        right: 30px;
        color: #f1f1f1;
        font-size: 40px;
        font-weight: bold;
        cursor: pointer;
        z-index: 10000;
    }

    #personal-photos-wrapper .caption {
        margin-top: 15px;
        color: #fff;
        text-align: center;
        font-size: 1.2rem;
        background-color: rgba(0, 0, 0, 0.6);
        padding: 10px;
        border-radius: 5px;
        max-width: 90%;
        font-family: sans-serif;
    }

    /* Glitch Fonts */
    #personal-photos-wrapper .font1 { font-family: Arial, sans-serif; }
    #personal-photos-wrapper .font2 { font-family: 'Times New Roman', serif; }
    #personal-photos-wrapper .font3 { font-family: 'Courier New', monospace; }
    #personal-photos-wrapper .font4 { font-family: Impact, sans-serif; }
    #personal-photos-wrapper .font5 { font-family: Georgia, serif; }
    #personal-photos-wrapper .font6 { font-family: Verdana, sans-serif; }
</style>

<script>
(function() {
    // --- INIT GUARD ---
    if (window.personalPhotosInitialized) return;
    window.personalPhotosInitialized = true;

    // --- GLITCH EFFECT ---
    const fontClasses = ['font1', 'font2', 'font3', 'font4', 'font5', 'font6'];
    const colors = ['#2F4F4F', '#4B0082', '#8B0000', '#000080', '#556B2F', '#8B4513', '#2E0854', '#191970'];
    const katakanaMap = {
        'A': 'ア', 'B': 'ブ', 'C': 'ク', 'D': 'デ', 'E': 'エ',
        'F': 'フ', 'G': 'グ', 'H': 'ハ', 'I': 'イ', 'J': 'ジ',
        'K': 'ケ', 'L': 'ル', 'M': 'ム', 'N': 'ン', 'O': 'オ',
        'P': 'プ', 'Q': 'キュ', 'R': 'ラ', 'S': 'ス', 'T': 'ト',
        'U': '牛', 'V': 'ヴ', 'W': 'ワ', 'X': 'クス', 'Y': 'ヤ', 'Z': 'ズ'
    };

    function changeFontRandomly(span) {
        if (!span.dataset.original) {
            span.dataset.original = span.innerText;
        }
        fontClasses.forEach(c => span.classList.remove(c));
        const randomIndex = Math.floor(Math.random() * fontClasses.length);
        span.classList.add(fontClasses[randomIndex]);

        if (Math.random() < 0.05) {
            const originalChar = span.dataset.original.toUpperCase();
            if (katakanaMap[originalChar]) {
                span.innerText = katakanaMap[originalChar];
            }
        } else {
            span.innerText = span.dataset.original;
        }

        const interval = Math.floor(Math.random() * (700 - 300 + 1)) + 300;
        setTimeout(() => changeFontRandomly(span), interval);
    }

    function changeColorRandomly(span) {
        const randomColorIndex = Math.floor(Math.random() * colors.length);
        span.style.color = colors[randomColorIndex];
        const interval = Math.floor(Math.random() * (1500 - 800 + 1)) + 800;
        setTimeout(() => changeColorRandomly(span), interval);
    }

    const wrapper = document.getElementById('personal-photos-wrapper');
    const spans = wrapper.querySelectorAll('.glitch-char');
    spans.forEach(span => {
        changeFontRandomly(span);
        changeColorRandomly(span);
    });

    // --- GALLERY LOGIC ---
    const grid = wrapper.querySelector('#photos-grid');
    const loadingMsg = wrapper.querySelector('#loading-message');
    const sortSelect = wrapper.querySelector('#sort-select');

    // REPO CONFIG
    const REPO_BASE = 'https://raw.githack.com/cju-media/personal-website/main/personal/photos/';
    const JSON_URL = REPO_BASE + 'photos.json';

    let allPhotos = [];

    function renderGrid(photos) {
        grid.innerHTML = ''; // Clear current grid

        photos.forEach(photo => {
            const item = document.createElement('div');
            item.className = 'photo-item';

            const src = REPO_BASE + photo.src;
            const thumb = photo.thumb ? (REPO_BASE + photo.thumb) : src;

            const img = document.createElement('img');
            img.src = thumb;
            img.alt = photo.caption || 'Photo';
            img.loading = 'lazy';
            img.onload = () => img.classList.add('loaded');

            item.appendChild(img);

            const isVideo = photo.type === 'video';

            if (isVideo) {
                const indicator = document.createElement('div');
                indicator.className = 'video-indicator';
                indicator.innerHTML = '&#9658;';
                item.appendChild(indicator);
            }

            item.addEventListener('click', () => {
                openLightbox(photo, src, isVideo);
            });

            grid.appendChild(item);
        });
    }

    function sortAndRender(criteria) {
        let sorted = [...allPhotos]; // Copy array

        if (criteria === 'random') {
            // Fisher-Yates
            for (let i = sorted.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [sorted[i], sorted[j]] = [sorted[j], sorted[i]];
            }
        } else if (criteria === 'date-desc') {
            sorted.sort((a, b) => new Date(b.date) - new Date(a.date));
        } else if (criteria === 'date-asc') {
            sorted.sort((a, b) => new Date(a.date) - new Date(b.date));
        }

        renderGrid(sorted);
    }

    sortSelect.addEventListener('change', (e) => {
        sortAndRender(e.target.value);
    });

    fetch(JSON_URL)
        .then(response => {
            if (!response.ok) throw new Error("Failed to load photos manifest");
            return response.json();
        })
        .then(photos => {
            if (!photos || photos.length === 0) {
                loadingMsg.textContent = "No photos found.";
                return;
            }

            loadingMsg.style.display = 'none';
            allPhotos = photos;

            // Initial render (Random default)
            sortAndRender('random');
        })
        .catch(err => {
            console.error(err);
            loadingMsg.textContent = "Error loading gallery.";
            loadingMsg.style.color = "red";
        });

    // --- LIGHTBOX ---
    const lightbox = wrapper.querySelector('#lightbox-modal');
    const lightboxImg = wrapper.querySelector('#lightbox-img');
    const lightboxVideo = wrapper.querySelector('#lightbox-video');
    const lightboxCaption = wrapper.querySelector('#lightbox-caption');
    const lightboxSpinner = wrapper.querySelector('#lightbox-spinner');
    const closeBtn = wrapper.querySelector('.close-btn');

    function openLightbox(photo, src, isVideo) {
        lightboxImg.style.display = 'none';
        lightboxVideo.style.display = 'none';
        lightboxSpinner.style.display = 'block'; // Show spinner
        lightboxVideo.pause();

        // Reset src to avoid showing previous image while loading
        lightboxImg.src = '';
        lightboxVideo.src = '';

        if (isVideo) {
            lightboxVideo.src = src;

            lightboxVideo.oncanplay = () => {
                lightboxSpinner.style.display = 'none';
                lightboxVideo.style.display = 'block';
                lightboxVideo.play().catch(e => console.log("Autoplay blocked", e));
            };

            // Fallback if cached or fast
            if (lightboxVideo.readyState >= 3) {
                 lightboxSpinner.style.display = 'none';
                 lightboxVideo.style.display = 'block';
            }

        } else {
            lightboxImg.src = src;

            lightboxImg.onload = () => {
                lightboxSpinner.style.display = 'none';
                lightboxImg.style.display = 'block';
            };
        }

        lightboxCaption.textContent = photo.caption || '';
        lightbox.classList.add('active');
    }

    closeBtn.addEventListener('click', () => {
        lightbox.classList.remove('active');
        lightboxVideo.pause();
    });

    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) {
            lightbox.classList.remove('active');
            lightboxVideo.pause();
        }
    });

    // Close on Escape key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightbox.classList.contains('active')) {
            lightbox.classList.remove('active');
            lightboxVideo.pause();
        }
    });

})();
</script>
