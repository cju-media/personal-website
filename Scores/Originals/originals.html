<!-- Originals Page Fragment -->
<div id="originals-page-wrapper">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display&family=VT323&display=swap');

        /* Scoped Styles */
        #originals-page-wrapper {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: auto;
            margin: 0;
            background-color: transparent; /* Inherit from Squarespace */
            padding: 60px 20px 20px 20px;
            box-sizing: border-box;
        }

        /* Glitch font classes */
        #originals-page-wrapper .font1 { font-family: Arial, sans-serif !important; }
        #originals-page-wrapper .font2 { font-family: Times New Roman, serif !important; }
        #originals-page-wrapper .font3 { font-family: Courier New, monospace !important; }
        #originals-page-wrapper .font4 { font-family: essay-text, monospace !important; }
        #originals-page-wrapper .font5 { font-family: 'Playfair Display', serif !important; }
        #originals-page-wrapper .font6 { font-family: 'VT323', monospace !important; transform: scale(1.1); }

        #originals-page-wrapper h1 {
            font-size: min(5vw, 3rem);
            text-align: center;
            display: flex;
            justify-content: center;
            flex-wrap: nowrap;
            margin-bottom: 40px;
            color: inherit; /* Inherit text color */
        }

        #originals-page-wrapper .text-block1 {
            padding-bottom: 25px;
        }

        #originals-page-wrapper .span-class {
            display: inline-block;
            width: 1.2em;
            text-align: center;
            vertical-align: bottom;
            line-height: 1.2;
        }

        /* Layout Styles */
        #originals-page-wrapper .content-wrapper {
            display: flex;
            flex-direction: row;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
            gap: 40px;
            padding: 20px;
        }

        #originals-page-wrapper #text-container {
            flex: 1;
            text-align: left;
            /* font-family: 'Playfair Display', serif; */
            /* font-size: 1.2rem; */
            line-height: 1.6;
            color: inherit; /* Inherit text color */
        }

        #originals-page-wrapper #button-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        /* Mobile / Vertical Styles */
        @media (max-width: 768px) {
            #originals-page-wrapper .content-wrapper {
                flex-direction: column;
                align-items: center;
            }

            #originals-page-wrapper #text-container {
                text-align: center;
                margin-bottom: 20px;
            }

            #originals-page-wrapper #button-container {
                width: 100%;
                max-width: 600px;
            }
        }

        /* Button Styles */
        #originals-page-wrapper .repo-button {
            display: block;
            padding: 15px 20px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            text-align: center;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #originals-page-wrapper .repo-button:hover {
            background-color: #555;
            transform: scale(1.02);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }

        /* Button Character Styles - to prevent jitter */
        #originals-page-wrapper .button-char {
            display: inline-block;
            width: 0.6em;
            text-align: center;
            vertical-align: bottom;
        }

        #originals-page-wrapper .loading {
            font-family: monospace;
            color: #666;
            font-size: 1.2rem;
        }

        /* Modal Styles */
        #original-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        #original-modal-content {
            background: #222;
            color: #ddd;
            width: 90%;
            max-width: 1000px;
            max-height: 90vh;
            border-radius: 8px;
            padding: 30px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        #original-modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }

        #original-modal-title {
            margin-top: 0;
            margin-bottom: 20px;
            color: #d3d3d3;
            font-family: 'Courier New', monospace;
            text-align: center;
            font-size: 2rem;
        }

        .original-visualizers-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #markdown-container {
            background: #333;
            padding: 20px;
            border-radius: 5px;
            font-family: sans-serif;
            line-height: 1.6;
        }

        #markdown-container h1, #markdown-container h2, #markdown-container h3 {
            color: #fff;
        }

        #markdown-container a {
            color: #4da6ff;
            text-decoration: none;
        }

        #markdown-container a:hover {
            text-decoration: underline;
        }

        #pdf-container {
            width: 100%;
            height: 60vh;
            border: 1px solid #555;
            border-radius: 5px;
            background: #fff;
        }

        @media (max-width: 768px) {
            #original-modal-content {
                padding: 20px 15px;
                width: 95%;
            }
            #pdf-container {
                height: 50vh;
            }
            #original-modal-title {
                font-size: 1.5rem;
            }
        }

    </style>

    <div class="text-block1">
        <h1>
            <span class="span-class">O</span>
            <span class="span-class">R</span>
            <span class="span-class">I</span>
            <span class="span-class">G</span>
            <span class="span-class">I</span>
            <span class="span-class">N</span>
            <span class="span-class">A</span>
            <span class="span-class">L</span>
            <span class="span-class">S</span>
        </h1>
    </div>

    <!-- Original Modal -->
    <div id="original-modal-overlay">
        <div id="original-modal-content">
            <button id="original-modal-close">&times;</button>
            <h2 id="original-modal-title">Original Details</h2>

            <div class="original-visualizers-container">
                <div id="markdown-container">
                    <div style="color: #999; text-align: center; font-family: monospace;">Loading description...</div>
                </div>
                <iframe id="pdf-container" src="" frameborder="0" style="display: none;"></iframe>
            </div>
        </div>
    </div>


    <div class="content-wrapper">
        <div id="text-container">
            <p>
              I like to write original music. For study, for work, for playing. Here you can find a collection of them.
            </p>
        </div>

        <div id="button-container">
            <div class="loading">Loading originals...</div>
        </div>
    </div>

    <script>
        (function() {
            function initOriginals() {
                // Prevent double initialization
                if (window.originalsInitialized) return;
                window.originalsInitialized = true;

                // Glitch Effect Logic
                const wrapper = document.getElementById('originals-page-wrapper');
                if (!wrapper) return; // Guard clause

                const Glitch = {
                    fontClasses: ['font1', 'font2', 'font3', 'font4', 'font5', 'font6'],
                    colors: ['#2F4F4F', '#4B0082', '#8B0000', '#000080', '#556B2F', '#8B4513', '#2E0854', '#191970'],
                    katakanaMap: {
                        'A': 'ア', 'B': 'ブ', 'C': 'ク', 'D': 'デ', 'E': 'エ',
                        'F': 'フ', 'G': 'グ', 'H': 'ハ', 'I': 'イ', 'J': 'ジ',
                        'K': 'ケ', 'L': 'ル', 'M': 'ム', 'N': 'ン', 'O': 'オ',
                        'P': 'プ', 'Q': 'キュ', 'R': 'ラ', 'S': 'ス', 'T': 'ト',
                        'U': '牛', 'V': 'ヴ', 'W': 'ワ', 'X': 'クス', 'Y': 'ヤ', 'Z': 'ズ'
                    },

                    start(span, enableColor = true) {
                        if (!span.dataset.original) {
                            span.dataset.original = span.innerText;
                        }
                        this.loopFont(span);
                        if (enableColor) {
                            this.loopColor(span);
                        }
                    },

                    stop(span) {
                        clearTimeout(span._fontTimeout);
                        clearTimeout(span._colorTimeout);
                        this.reset(span);
                    },

                    reset(span) {
                        if (span.dataset.original) {
                            span.innerText = span.dataset.original;
                        }
                        span.style.color = ''; // Reset to inherited
                        this.fontClasses.forEach(c => span.classList.remove(c));
                    },

                    loopFont(span) {
                        const tick = () => {
                            // Change Font
                            this.fontClasses.forEach(fontClass => span.classList.remove(fontClass));
                            const randomIndex = Math.floor(Math.random() * this.fontClasses.length);
                            span.classList.add(this.fontClasses[randomIndex]);

                            // Chance to change to Katakana
                            if (Math.random() < 0.05) {
                                const originalChar = span.dataset.original.toUpperCase();
                                if (this.katakanaMap[originalChar]) {
                                    span.innerText = this.katakanaMap[originalChar];
                                }
                            } else {
                                span.innerText = span.dataset.original;
                            }

                            // Schedule next tick
                            const interval = Math.floor(Math.random() * (700 - 300 + 1)) + 300;
                            span._fontTimeout = setTimeout(tick, interval);
                        };
                        tick();
                    },

                    loopColor(span) {
                        const tick = () => {
                            // Change Color
                            const randomColorIndex = Math.floor(Math.random() * this.colors.length);
                            span.style.color = this.colors[randomColorIndex];

                            // Schedule next tick
                            const interval = Math.floor(Math.random() * (1500 - 800 + 1)) + 800;
                            span._colorTimeout = setTimeout(tick, interval);
                        };
                        tick();
                    }
                };

                // Initialize Title Spans (Continuous)
                const titleSpans = wrapper.querySelectorAll('.text-block1 .span-class');
                titleSpans.forEach(span => {
                    Glitch.start(span);
                });

                // Fetch GitHub Directory using git trees API
                const container = wrapper.querySelector('#button-container');
                const apiUrl = 'https://api.github.com/repos/cju-media/Scores/git/trees/main?recursive=1';
                const repoUrlBase = 'https://github.com/cju-media/Scores/tree/main/Originals/';

                // Load marked.js dynamically
                function loadMarked(callback) {
                    if (window.marked) {
                        callback();
                        return;
                    }
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
                    script.onload = callback;
                    document.head.appendChild(script);
                }

                function openOriginalModal(readmeUrl, pdfUrl, titleText) {
                    const modal = document.getElementById('original-modal-overlay');
                    if (!modal) return;

                    const title = document.getElementById('original-modal-title');
                    const mdContainer = document.getElementById('markdown-container');
                    const pdfContainer = document.getElementById('pdf-container');

                    if (title) title.textContent = titleText;

                    // Reset containers
                    mdContainer.innerHTML = '<div style="color: #999; text-align: center; font-family: monospace;">Loading description...</div>';
                    pdfContainer.style.display = 'none';
                    pdfContainer.src = '';

                    modal.style.display = 'flex';
                    document.body.style.overflow = 'hidden';

                    // Fetch and render README
                    fetch(readmeUrl)
                        .then(res => {
                            if (!res.ok) throw new Error("Failed to fetch README");
                            return res.text();
                        })
                        .then(mdText => {
                            loadMarked(() => {
                                mdContainer.innerHTML = marked.parse(mdText);
                            });
                        })
                        .catch(err => {
                            console.error(err);
                            mdContainer.innerHTML = '<div style="color: red;">Failed to load description.</div>';
                        });

                    // Set PDF if available
                    if (pdfUrl) {
                        pdfContainer.src = pdfUrl;
                        pdfContainer.style.display = 'block';
                    }
                }

                // Modal close logic
                const modalOverlay = document.getElementById('original-modal-overlay');
                if (modalOverlay) {
                    const closeBtn = document.getElementById('original-modal-close');
                    const closeModal = () => {
                        modalOverlay.style.display = 'none';
                        document.body.style.overflow = '';
                        const pdfContainer = document.getElementById('pdf-container');
                        if (pdfContainer) {
                            pdfContainer.src = ''; // Stop loading/playing
                        }
                    };

                    if (closeBtn) closeBtn.addEventListener('click', closeModal);
                    modalOverlay.addEventListener('click', (e) => {
                        if (e.target === modalOverlay) closeModal();
                    });

                    if (!window.originalsKeydownAttached) {
                        document.addEventListener('keydown', (e) => {
                            if (modalOverlay.style.display === 'flex' && e.key === 'Escape') {
                                closeModal();
                            }
                        });
                        window.originalsKeydownAttached = true;
                    }
                }

                fetch(apiUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`GitHub API Error: ${response.statusText}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        container.innerHTML = ''; // Clear loading message

                        const tree = data.tree || [];
                        const originalsData = {}; // Format: { "folder-name": [ {path, type}, ... ] }

                        tree.forEach(item => {
                            if (item.path.startsWith('Originals/')) {
                                const relativePath = item.path.substring(10); // Remove 'Originals/' prefix
                                const parts = relativePath.split('/');

                                if (parts.length > 0) {
                                    const dirName = parts[0];
                                    // Ignore the root 'Originals' itself if it somehow appears, and ignore empty names
                                    if (dirName && dirName !== '') {
                                        if (!originalsData[dirName]) {
                                            originalsData[dirName] = { files: [], path: dirName };
                                        }
                                        if (parts.length > 1) {
                                            // It's a file inside the directory
                                            originalsData[dirName].files.push({
                                                name: parts.slice(1).join('/'),
                                                path: item.path,
                                                type: item.type
                                            });
                                        }
                                    }
                                }
                            }
                        });

                        const directories = Object.values(originalsData);

                        if (directories.length === 0) {
                            container.innerHTML = '<div class="loading">No originals found.</div>';
                            return;
                        }

                        directories.forEach(dir => {
                            const link = document.createElement('a');
                            link.href = repoUrlBase + encodeURIComponent(dir.path);
                            link.className = 'repo-button';
                            link.target = '_blank';
                            link.rel = 'noopener noreferrer';

                            // Build spans for button text
                            const text = dir.path;
                            for (let char of text) {
                                const span = document.createElement('span');
                                span.textContent = char;
                                span.className = 'button-char';
                                // Pre-set original for Glitch object logic
                                span.dataset.original = char;
                                link.appendChild(span);
                            }

                            // Interactive Glitch on Hover
                            link.addEventListener('mouseenter', () => {
                                const chars = link.querySelectorAll('.button-char');
                                chars.forEach(span => Glitch.start(span, false)); // false = disable color glitch
                            });

                            link.addEventListener('mouseleave', () => {
                                const chars = link.querySelectorAll('.button-char');
                                chars.forEach(span => Glitch.stop(span));
                            });

                            // Check for README
                            const readmeFile = dir.files.find(f => f.name.toLowerCase() === 'readme.md');
                            const pdfFile = dir.files.find(f => f.name.toLowerCase().endsWith('.pdf'));

                            if (readmeFile) {
                                let isFetching = false;
                                link.addEventListener('click', (e) => {
                                    e.preventDefault();
                                    if (isFetching) return;

                                    const rawReadmeUrl = `https://raw.githubusercontent.com/cju-media/Scores/main/Originals/${encodeURIComponent(dir.path)}/${encodeURIComponent(readmeFile.name)}`;
                                    let rawPdfUrl = null;
                                    if (pdfFile) {
                                        rawPdfUrl = `https://cdn.jsdelivr.net/gh/cju-media/Scores@main/Originals/${encodeURIComponent(dir.path)}/${encodeURIComponent(pdfFile.name)}`;
                                    }

                                    openOriginalModal(rawReadmeUrl, rawPdfUrl, dir.path);
                                });
                            }

                            container.appendChild(link);
                        });
                    })
                    .catch(error => {
                        console.error('Error fetching originals:', error);
                        container.innerHTML = `<div class="loading" style="color: red;">Error loading originals. Please try again later.</div>`;
                    });
            }

            // Initialization logic for Squarespace
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initOriginals);
            } else {
                initOriginals();
            }
        })();
    </script>
</div>
