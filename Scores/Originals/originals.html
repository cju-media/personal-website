    <script>
        (function() {
            function initOriginals() {
                // Prevent double initialization
                if (window.originalsInitialized) return;
                window.originalsInitialized = true;

                // Glitch Effect Logic
                const wrapper = document.getElementById('originals-page-wrapper');
                if (!wrapper) return; // Guard clause

                const Glitch = {
                    fontClasses: ['font1', 'font2', 'font3', 'font4', 'font5', 'font6'],
                    colors: ['#2F4F4F', '#4B0082', '#8B0000', '#000080', '#556B2F', '#8B4513', '#2E0854', '#191970'],
                    katakanaMap: {
                        'A': 'ア', 'B': 'ブ', 'C': 'ク', 'D': 'デ', 'E': 'エ',
                        'F': 'フ', 'G': 'グ', 'H': 'ハ', 'I': 'イ', 'J': 'ジ',
                        'K': 'ケ', 'L': 'ル', 'M': 'ム', 'N': 'ン', 'O': 'オ',
                        'P': 'プ', 'Q': 'キュ', 'R': 'ラ', 'S': 'ス', 'T': 'ト',
                        'U': '牛', 'V': 'ヴ', 'W': 'ワ', 'X': 'クス', 'Y': 'ヤ', 'Z': 'ズ'
                    },

                    start(span, enableColor = true) {
                        if (!span.dataset.original) {
                            span.dataset.original = span.innerText;
                        }
                        this.loopFont(span);
                        if (enableColor) {
                            this.loopColor(span);
                        }
                    },

                    stop(span) {
                        clearTimeout(span._fontTimeout);
                        clearTimeout(span._colorTimeout);
                        this.reset(span);
                    },

                    reset(span) {
                        if (span.dataset.original) {
                            span.innerText = span.dataset.original;
                        }
                        span.style.color = ''; // Reset to inherited
                        this.fontClasses.forEach(c => span.classList.remove(c));
                    },

                    loopFont(span) {
                        const tick = () => {
                            // Change Font
                            this.fontClasses.forEach(fontClass => span.classList.remove(fontClass));
                            const randomIndex = Math.floor(Math.random() * this.fontClasses.length);
                            span.classList.add(this.fontClasses[randomIndex]);

                            // Chance to change to Katakana
                            if (Math.random() < 0.05) {
                                const originalChar = span.dataset.original.toUpperCase();
                                if (this.katakanaMap[originalChar]) {
                                    span.innerText = this.katakanaMap[originalChar];
                                }
                            } else {
                                span.innerText = span.dataset.original;
                            }

                            // Schedule next tick
                            const interval = Math.floor(Math.random() * (700 - 300 + 1)) + 300;
                            span._fontTimeout = setTimeout(tick, interval);
                        };
                        tick();
                    },

                    loopColor(span) {
                        const tick = () => {
                            // Change Color
                            const randomColorIndex = Math.floor(Math.random() * this.colors.length);
                            span.style.color = this.colors[randomColorIndex];

                            // Schedule next tick
                            const interval = Math.floor(Math.random() * (1500 - 800 + 1)) + 800;
                            span._colorTimeout = setTimeout(tick, interval);
                        };
                        tick();
                    }
                };

                // Initialize Title Spans (Continuous)
                const titleSpans = wrapper.querySelectorAll('.text-block1 .span-class');
                titleSpans.forEach(span => {
                    Glitch.start(span);
                });

                // Fetch GitHub Directory using git trees API
                const container = wrapper.querySelector('#button-container');
                const apiUrl = 'https://api.github.com/repos/cju-media/Scores/git/trees/main?recursive=1';
                const repoUrlBase = 'https://github.com/cju-media/Scores/tree/main/Originals/';

                // Load pdf.js dynamically
                function loadPdfJs(callback) {
                    if (window['pdfjs-dist/build/pdf']) {
                        callback();
                        return;
                    }
                    const script = document.createElement('script');
                    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js';
                    script.onload = () => {
                        window.pdfjsLib = window['pdfjs-dist/build/pdf'];
                        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
                        callback();
                    };
                    document.head.appendChild(script);
                }

                // Load marked.js dynamically
                function loadMarked(callback) {
                    if (window.marked) {
                        callback();
                        return;
                    }
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
                    script.onload = callback;
                    document.head.appendChild(script);
                }

                function openOriginalModal(readmeUrl, pdfUrl, titleText, githubUrl, partsFiles) {
                    const modal = document.getElementById('original-modal-overlay');
                    if (!modal) return;

                    const title = document.getElementById('original-modal-title');
                    const mdContainer = document.getElementById('markdown-container');
                    const pdfContainer = document.getElementById('pdf-container');

                    const githubLink = document.getElementById('github-link');
                    const partsLink = document.getElementById('parts-link');
                    const scoreLink = document.getElementById('score-link');

                    if (title) title.textContent = titleText;

                    // Reset containers
                    mdContainer.innerHTML = '<div style="color: #999; text-align: center; font-family: monospace;">Loading description...</div>';
                    pdfContainer.style.display = 'none';
                    pdfContainer.innerHTML = ''; // Clear old canvases

                    modal.style.display = 'flex';
                    document.body.style.overflow = 'hidden';

                    // Update URL hash
                    history.pushState(null, null, '#' + encodeURIComponent(titleText));

                    // Fetch and render README
                    fetch(readmeUrl)
                        .then(res => {
                            if (!res.ok) throw new Error("Failed to fetch README");
                            return res.text();
                        })
                        .then(mdText => {
                            // Strip hashtag lines before rendering so they are hidden from visitors
                            const cleanText = mdText.replace(/(?:^|\n)#\s*.+/g, '').trim();

                            loadMarked(() => {
                                mdContainer.innerHTML = marked.parse(cleanText);
                                const links = mdContainer.querySelectorAll('a');
                                links.forEach(link => {
                                    link.setAttribute('target', '_blank');
                                    link.setAttribute('rel', 'noopener noreferrer');
                                });
                            });
                        })
                        .catch(err => {
                            console.error(err);
                            mdContainer.innerHTML = '<div style="color: red;">Failed to load description.</div>';
                        });

                    // Set PDF if available
                    if (pdfUrl) {
                        pdfContainer.style.display = 'block';
                        pdfContainer.innerHTML = '<div style="color: #999; text-align: center; font-family: monospace; padding: 20px;">Loading PDF...</div>';

                        loadPdfJs(() => {
                            pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {
                                pdfContainer.innerHTML = ''; // Clear loading text

                                const numPages = pdf.numPages;

                                // Fetch page 1 just to establish the baseline aspect ratio and scale
                                pdf.getPage(1).then(firstPage => {
                                    const unscaledViewport = firstPage.getViewport({ scale: 1.0 });
                                    // Base scale on container width so it fits horizontally on mobile
                                    const padding = 20; // Allow some margin
                                    const scale = (pdfContainer.clientWidth - padding) / unscaledViewport.width;
                                    const viewport = firstPage.getViewport({ scale: scale });
                                    const pageHeight = viewport.height;
                                    const pageWidth = viewport.width;

                                    // Create an observer to manage the virtual window
                                    // rootMargin roughly tall enough to cover ~10 pages above and 10 pages below
                                    // Let's use a dynamic pixel height
                                    const margin = Math.floor(pageHeight * 10) + "px";

                                    const pageObserver = new IntersectionObserver((entries) => {
                                        entries.forEach(entry => {
                                            const pageNum = parseInt(entry.target.dataset.pageNumber, 10);
                                            if (entry.isIntersecting) {
                                                // Page scrolled into the buffer window, render it
                                                if (!entry.target.dataset.rendering) {
                                                    entry.target.dataset.rendering = "true";

                                                    pdf.getPage(pageNum).then(page => {
                                                        const canvas = document.createElement('canvas');
                                                        canvas.className = 'pdf-page-canvas';
                                                        const context = canvas.getContext('2d');

                                                        const outputScale = window.devicePixelRatio || 1;
                                                        canvas.width = Math.floor(pageWidth * outputScale);
                                                        canvas.height = Math.floor(pageHeight * outputScale);
                                                        canvas.style.width = Math.floor(pageWidth) + "px";
                                                        canvas.style.height = Math.floor(pageHeight) + "px";

                                                        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

                                                        const renderContext = {
                                                            canvasContext: context,
                                                            transform: transform,
                                                            viewport: page.getViewport({ scale: scale })
                                                        };

                                                        // Store reference to cancel if needed, or just append
                                                        entry.target.appendChild(canvas);
                                                        page.render(renderContext);
                                                    });
                                                }
                                            } else {
                                                // Page left the buffer window, clear it from memory
                                                entry.target.innerHTML = '';
                                                entry.target.dataset.rendering = "";
                                            }
                                        });
                                    }, { root: pdfContainer, rootMargin: `${margin} 0px ${margin} 0px` });

                                    // Create empty placeholder wrappers for all pages
                                    for (let i = 1; i <= numPages; i++) {
                                        const wrapper = document.createElement('div');
                                        wrapper.className = 'pdf-page-wrapper';
                                        wrapper.dataset.pageNumber = i;
                                        wrapper.style.width = Math.floor(pageWidth) + "px";
                                        wrapper.style.height = Math.floor(pageHeight) + "px";
                                        wrapper.style.margin = "0 auto 20px auto";
                                        wrapper.style.backgroundColor = "#fff";
                                        wrapper.style.boxShadow = "0 4px 8px rgba(0,0,0,0.1)";
                                        wrapper.style.display = "flex";
                                        wrapper.style.alignItems = "center";
                                        wrapper.style.justifyContent = "center";

                                        pdfContainer.appendChild(wrapper);
                                        pageObserver.observe(wrapper);
                                    }
                                });

                            }).catch(err => {
                                console.error('Error loading PDF: ', err);
                                pdfContainer.innerHTML = '<div style="color: red; padding: 20px; text-align: center;">Failed to load PDF viewer. Please try opening in GitHub.</div>';
                            });
                        });
                    }

                    // Set Parts button (opens the parts modal)
                    if (partsFiles && partsFiles.length && partsLink) {
                        partsLink.style.display = 'block';
                        partsLink.onclick = () => openPartsModal(titleText, partsFiles);
                    } else if (partsLink) {
                        partsLink.style.display = 'none';
                        partsLink.onclick = null;
                    }

                    // Set GitHub link
                    if (githubUrl && githubLink) {
                        githubLink.href = githubUrl;
                        githubLink.style.display = 'block';
                    } else if (githubLink) {
                        githubLink.style.display = 'none';
                    }

                    // Set Score Link
                    if (pdfUrl && scoreLink) {
                        scoreLink.href = pdfUrl;
                        scoreLink.style.display = 'block';
                    } else if (scoreLink) {
                        scoreLink.style.display = 'none';
                    }
                }

                // Build a glitchy repo-button styled item, matching the score list buttons
                function buildGlitchButton(labelText) {
                    const link = document.createElement('a');
                    link.className = 'repo-button';

                    for (let char of labelText) {
                        const span = document.createElement('span');
                        span.textContent = char;
                        span.className = 'button-char';
                        span.dataset.original = char;
                        link.appendChild(span);
                    }

                    link.addEventListener('mouseenter', () => {
                        link.querySelectorAll('.button-char').forEach(span => Glitch.start(span, false));
                    });
                    link.addEventListener('mouseleave', () => {
                        link.querySelectorAll('.button-char').forEach(span => Glitch.stop(span));
                    });

                    return link;
                }

                // Function to open the Parts modal with one item per part
                function openPartsModal(titleText, partsFiles) {
                    const modal = document.getElementById('parts-modal-overlay');
                    if (!modal) return;

                    const title = document.getElementById('parts-modal-title');
                    const list = document.getElementById('parts-list-container');
                    if (title) title.textContent = titleText + ' \u2014 Parts'; // em dash via escape so it renders regardless of page charset
                    list.innerHTML = '';

                    partsFiles
                        .slice()
                        .sort((a, b) => a.label.localeCompare(b.label))
                        .forEach(part => {
                            const link = buildGlitchButton(part.label);
                            link.href = part.url;
                            link.target = '_blank';
                            link.rel = 'noopener noreferrer';
                            list.appendChild(link);
                        });

                    modal.style.display = 'flex';
                    document.body.style.overflow = 'hidden';
                }

                // Parts modal close logic
                const partsOverlay = document.getElementById('parts-modal-overlay');
                if (partsOverlay) {
                    const partsCloseBtn = document.getElementById('parts-modal-close');
                    const closePartsModal = () => {
                        partsOverlay.style.display = 'none';
                        // Keep body scroll locked if the original modal is still open underneath
                        const orig = document.getElementById('original-modal-overlay');
                        if (!orig || orig.style.display !== 'flex') {
                            document.body.style.overflow = '';
                        }
                    };

                    if (partsCloseBtn) partsCloseBtn.addEventListener('click', closePartsModal);
                    partsOverlay.addEventListener('click', (e) => {
                        if (e.target === partsOverlay) closePartsModal();
                    });

                    if (!window.originalsPartsKeydownAttached) {
                        document.addEventListener('keydown', (e) => {
                            if (partsOverlay.style.display === 'flex' && e.key === 'Escape') {
                                e.stopImmediatePropagation();
                                closePartsModal();
                            }
                        }, true);
                        window.originalsPartsKeydownAttached = true;
                    }
                }

                // Modal close logic
                const modalOverlay = document.getElementById('original-modal-overlay');
                if (modalOverlay) {
                    const closeBtn = document.getElementById('original-modal-close');
                    const closeModal = () => {
                        modalOverlay.style.display = 'none';
                        document.body.style.overflow = '';
                        const pdfContainer = document.getElementById('pdf-container');
                        if (pdfContainer) {
                            pdfContainer.innerHTML = ''; // Clear loaded canvases
                        }

                        // Clear URL hash
                        if (window.location.hash) {
                            history.replaceState(null, null, window.location.pathname + window.location.search);
                        }
                    };

                    if (closeBtn) closeBtn.addEventListener('click', closeModal);
                    modalOverlay.addEventListener('click', (e) => {
                        if (e.target === modalOverlay) closeModal();
                    });

                    if (!window.originalsKeydownAttached) {
                        document.addEventListener('keydown', (e) => {
                            if (modalOverlay.style.display === 'flex' && e.key === 'Escape') {
                                closeModal();
                            }
                        });
                        window.originalsKeydownAttached = true;
                    }
                }

                fetch(apiUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`GitHub API Error: ${response.statusText}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        container.innerHTML = ''; // Clear loading message

                        const tree = data.tree || [];
                        const originalsData = {}; // Format: { "folder-name": [ {path, type}, ... ] }

                        tree.forEach(item => {
                            if (item.path.startsWith('Originals/')) {
                                const relativePath = item.path.substring(10); // Remove 'Originals/' prefix
                                const parts = relativePath.split('/');

                                if (parts.length > 0) {
                                    const dirName = parts[0];
                                    // Ignore the root 'Originals' itself if it somehow appears, and ignore empty names
                                    if (dirName && dirName !== '') {
                                        if (!originalsData[dirName]) {
                                            originalsData[dirName] = { files: [], path: dirName };
                                        }
                                        if (parts.length > 1) {
                                            // It's a file inside the directory
                                            originalsData[dirName].files.push({
                                                name: parts.slice(1).join('/'),
                                                path: item.path,
                                                type: item.type
                                            });
                                        }
                                    }
                                }
                            }
                        });

                        const directories = Object.values(originalsData);

                        if (directories.length === 0) {
                            container.innerHTML = '<div class="loading">No originals found.</div>';
                            return;
                        }

                        directories.forEach(dir => {
                            const link = document.createElement('a');
                            link.href = repoUrlBase + encodeURIComponent(dir.path);
                            link.className = 'repo-button';
                            link.target = '_blank';
                            link.rel = 'noopener noreferrer';
                            link.dataset.dirPath = dir.path;

                            // Build spans for button text
                            const text = dir.path;
                            for (let char of text) {
                                const span = document.createElement('span');
                                span.textContent = char;
                                span.className = 'button-char';
                                // Pre-set original for Glitch object logic
                                span.dataset.original = char;
                                link.appendChild(span);
                            }

                            // Interactive Glitch on Hover
                            link.addEventListener('mouseenter', () => {
                                const chars = link.querySelectorAll('.button-char');
                                chars.forEach(span => Glitch.start(span, false)); // false = disable color glitch
                            });

                            link.addEventListener('mouseleave', () => {
                                const chars = link.querySelectorAll('.button-char');
                                chars.forEach(span => Glitch.stop(span));
                            });

                            // Check for README
                            const readmeFile = dir.files.find(f => f.name.toLowerCase() === 'readme.md');
                            // Ensure we only grab the top-level PDF, not ones inside 'Parts'
                            const pdfFile = dir.files.find(f => f.name.toLowerCase().endsWith('.pdf') && !f.name.toLowerCase().includes('/'));
                            // Collect individual part files (PDFs living inside the 'Parts' folder)
                            const partsFiles = dir.files
                                .filter(f => f.name.toLowerCase().startsWith('parts/') && f.name.toLowerCase().endsWith('.pdf'))
                                .map(f => {
                                    const subPath = f.name.substring(f.name.indexOf('/') + 1); // strip 'Parts/'
                                    const baseName = subPath.replace(/\.pdf$/i, '');
                                    const label = baseName.split(' - ').pop().trim() || baseName;
                                    return {
                                        label: label,
                                        url: `https://cdn.jsdelivr.net/gh/cju-media/Scores@main/Originals/${encodeURIComponent(dir.path)}/Parts/${encodeURIComponent(subPath)}`
                                    };
                                });

                            if (readmeFile) {
                                let isFetching = false;
                                link.addEventListener('click', (e) => {
                                    e.preventDefault();
                                    if (isFetching) return;

                                    const rawReadmeUrl = `https://raw.githubusercontent.com/cju-media/Scores/main/Originals/${encodeURIComponent(dir.path)}/${encodeURIComponent(readmeFile.name)}`;
                                    let rawPdfUrl = null;
                                    if (pdfFile) {
                                        rawPdfUrl = `https://cdn.jsdelivr.net/gh/cju-media/Scores@main/Originals/${encodeURIComponent(dir.path)}/${encodeURIComponent(pdfFile.name)}`;
                                    }

                                    const githubUrl = repoUrlBase + encodeURIComponent(dir.path);

                                    openOriginalModal(rawReadmeUrl, rawPdfUrl, dir.path, githubUrl, partsFiles);
                                });
                            }

                            container.appendChild(link);
                        });

                        // Fetch all READMEs to build the tag filter
                        const fetchPromises = directories.map(dir => {
                            const readmeFile = dir.files.find(f => f.name.toLowerCase() === 'readme.md');
                            if (readmeFile) {
                                const rawReadmeUrl = `https://raw.githubusercontent.com/cju-media/Scores/main/Originals/${encodeURIComponent(dir.path)}/${encodeURIComponent(readmeFile.name)}`;
                                return fetch(rawReadmeUrl)
                                    .then(res => res.ok ? res.text() : null)
                                    .then(text => ({ dirPath: dir.path, text }));
                            }
                            return Promise.resolve({ dirPath: dir.path, text: null });
                        });

                        Promise.all(fetchPromises).then(results => {
                            const tagMap = new Map(); // Tag -> Set of dirPaths
                            const allTags = new Set();

                            results.forEach(({ dirPath, text }) => {
                                if (text) {
                                    // Extract full-line tags starting with #
                                    const regex = /(?:^|\n)#\s*(.+)/g;
                                    let match;
                                    while ((match = regex.exec(text)) !== null) {
                                        const tag = match[1].trim().toLowerCase();
                                        allTags.add(tag);
                                        if (!tagMap.has(tag)) {
                                            tagMap.set(tag, new Set());
                                        }
                                        tagMap.get(tag).add(dirPath);
                                    }
                                }
                            });

                            if (allTags.size > 0) {
                                const filterContainer = document.getElementById('filter-container');
                                const tagFilter = document.getElementById('tag-filter');

                                // Sort tags alphabetically and populate the select
                                Array.from(allTags).sort().forEach(tag => {
                                    const option = document.createElement('option');
                                    option.value = tag;
                                    option.textContent = tag;
                                    tagFilter.appendChild(option);
                                });

                                filterContainer.style.display = 'block';

                                tagFilter.addEventListener('change', (e) => {
                                    const selectedTag = e.target.value;
                                    const allButtons = container.querySelectorAll('.repo-button');

                                    allButtons.forEach(btn => {
                                        const dirPath = btn.dataset.dirPath;
                                        if (selectedTag === 'all') {
                                            btn.style.display = 'block';
                                        } else {
                                            if (tagMap.has(selectedTag) && tagMap.get(selectedTag).has(dirPath)) {
                                                btn.style.display = 'block';
                                            } else {
                                                btn.style.display = 'none';
                                            }
                                        }
                                    });
                                });
                            }
                        });

                        // Check if there's a hash in the URL to automatically open a modal
                        if (window.location.hash) {
                            const hashValue = decodeURIComponent(window.location.hash.substring(1));
                            const matchingLink = Array.from(container.querySelectorAll('.repo-button')).find(link => {
                                const textSpans = link.querySelectorAll('.button-char');
                                let text = '';
                                textSpans.forEach(span => text += span.dataset.original);
                                return text === hashValue;
                            });

                            if (matchingLink) {
                                // Some browsers drop standard .click() on anchors if not trusted. Dispatch a custom event.
                                const event = new MouseEvent('click', {
                                    view: window,
                                    bubbles: true,
                                    cancelable: true
                                });
                                matchingLink.dispatchEvent(event);
                            }
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching originals:', error);
                        container.innerHTML = `<div class="loading" style="color: red;">Error loading originals. Please try again later.</div>`;
                    });
            }

            // Initialization logic for Squarespace
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initOriginals);
            } else {
                initOriginals();
            }
        })();
    </script>
</div>
