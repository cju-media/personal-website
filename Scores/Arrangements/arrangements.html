<!-- Arrangements Page Fragment -->
<div id="arrangements-page-wrapper">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display&family=VT323&display=swap');

        /* Scoped Styles */
        #arrangements-page-wrapper {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: auto;
            margin: 0;
            background-color: transparent; /* Inherit from Squarespace */
            padding: 60px 20px 20px 20px;
            box-sizing: border-box;
        }

        /* Glitch font classes */
        #arrangements-page-wrapper .font1 { font-family: Arial, sans-serif !important; }
        #arrangements-page-wrapper .font2 { font-family: Times New Roman, serif !important; }
        #arrangements-page-wrapper .font3 { font-family: Courier New, monospace !important; }
        #arrangements-page-wrapper .font4 { font-family: essay-text, monospace !important; }
        #arrangements-page-wrapper .font5 { font-family: 'Playfair Display', serif !important; }
        #arrangements-page-wrapper .font6 { font-family: 'VT323', monospace !important; transform: scale(1.1); }

        #arrangements-page-wrapper h1 {
            font-size: min(5vw, 3rem);
            text-align: center;
            display: flex;
            justify-content: center;
            flex-wrap: nowrap;
            margin-bottom: 40px;
            color: inherit; /* Inherit text color */
        }

        #arrangements-page-wrapper .text-block1 {
            padding-bottom: 25px;
        }

        #arrangements-page-wrapper .span-class {
            display: inline-block;
            width: 1.2em;
            text-align: center;
            vertical-align: bottom;
            line-height: 1.2;
        }

        /* Layout Styles */
        #arrangements-page-wrapper .content-wrapper {
            display: flex;
            flex-direction: row;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
            gap: 40px;
            padding: 20px;
        }

        #arrangements-page-wrapper #text-container {
            flex: 1;
            text-align: left;
            /* font-family: 'Playfair Display', serif; */
            /* font-size: 1.2rem; */
            line-height: 1.6;
            color: inherit; /* Inherit text color */
        }

        #arrangements-page-wrapper #button-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        /* Mobile / Vertical Styles */
        @media (max-width: 768px) {
            #arrangements-page-wrapper .content-wrapper {
                flex-direction: column;
                align-items: center;
            }

            #arrangements-page-wrapper #text-container {
                text-align: center;
                margin-bottom: 20px;
            }

            #arrangements-page-wrapper #button-container {
                width: 100%;
                max-width: 600px;
            }
        }

        /* Button Styles */
        #arrangements-page-wrapper .repo-button {
            display: block;
            padding: 15px 20px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            text-align: center;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #arrangements-page-wrapper .repo-button:hover {
            background-color: #555;
            transform: scale(1.02);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }

        /* Button Character Styles - to prevent jitter */
        #arrangements-page-wrapper .button-char {
            display: inline-block;
            width: 0.6em;
            text-align: center;
            vertical-align: bottom;
        }

        #arrangements-page-wrapper .loading {
            font-family: monospace;
            color: #666;
            font-size: 1.2rem;
        }

        /* Parts Modal Styles */
        #parts-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        #parts-modal-content {
            background: #222;
            color: #ddd;
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            border-radius: 8px;
            padding: 30px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        #parts-modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }

        #parts-modal-title {
            margin-top: 0;
            margin-bottom: 20px;
            padding: 0 30px;
            color: #d3d3d3;
            font-family: 'Courier New', monospace;
            text-align: center;
            font-size: 2rem;
        }

        #parts-sort-toggle {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        #parts-sort-toggle button {
            padding: 6px 14px;
            background: #333;
            color: #aaa;
            border: 1px solid #555;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        #parts-sort-toggle button:hover {
            color: #fff;
        }

        #parts-sort-toggle button.active {
            background: #555;
            color: #fff;
        }

        #parts-list-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @media (max-width: 768px) {
            #parts-modal-content {
                padding: 20px 15px;
                width: 95%;
            }
            #parts-modal-title {
                font-size: 1.5rem;
            }
        }
    </style>

    <div class="text-block1">
        <h1>
            <span class="span-class">A</span>
            <span class="span-class">R</span>
            <span class="span-class">R</span>
            <span class="span-class">A</span>
            <span class="span-class">N</span>
            <span class="span-class">G</span>
            <span class="span-class">E</span>
            <span class="span-class">M</span>
            <span class="span-class">E</span>
            <span class="span-class">N</span>
            <span class="span-class">T</span>
            <span class="span-class">S</span>
        </h1>
    </div>

    <div class="content-wrapper">
        <div id="text-container">
            <p>
              I like to write arrangements. For study, for work, for playing. Here you can find a collection of them.
            </p>
        </div>

        <div id="button-container">
            <div class="loading">Loading arrangements...</div>
        </div>

    <!-- Parts Modal -->
    <div id="parts-modal-overlay">
        <div id="parts-modal-content">
            <button id="parts-modal-close">&times;</button>
            <h2 id="parts-modal-title">Parts</h2>
            <div id="parts-sort-toggle">
                <button type="button" data-sort="score" class="active">Score order</button>
                <button type="button" data-sort="alpha">A-Z</button>
            </div>
            <div id="parts-list-container"></div>
        </div>
    </div>

    <script>
        (function() {
            function initArrangements() {
                // Prevent double initialization
                if (window.arrangementsInitialized) return;
                window.arrangementsInitialized = true;

                // Glitch Effect Logic
                const wrapper = document.getElementById('arrangements-page-wrapper');
                if (!wrapper) return; // Guard clause

                const Glitch = {
                    fontClasses: ['font1', 'font2', 'font3', 'font4', 'font5', 'font6'],
                    colors: ['#2F4F4F', '#4B0082', '#8B0000', '#000080', '#556B2F', '#8B4513', '#2E0854', '#191970'],
                    katakanaMap: {
                        'A': 'ア', 'B': 'ブ', 'C': 'ク', 'D': 'デ', 'E': 'エ',
                        'F': 'フ', 'G': 'グ', 'H': 'ハ', 'I': 'イ', 'J': 'ジ',
                        'K': 'ケ', 'L': 'ル', 'M': 'ム', 'N': 'ン', 'O': 'オ',
                        'P': 'プ', 'Q': 'キュ', 'R': 'ラ', 'S': 'ス', 'T': 'ト',
                        'U': '牛', 'V': 'ヴ', 'W': 'ワ', 'X': 'クス', 'Y': 'ヤ', 'Z': 'ズ'
                    },

                    start(span, enableColor = true) {
                        if (!span.dataset.original) {
                            span.dataset.original = span.innerText;
                        }
                        this.loopFont(span);
                        if (enableColor) {
                            this.loopColor(span);
                        }
                    },

                    stop(span) {
                        clearTimeout(span._fontTimeout);
                        clearTimeout(span._colorTimeout);
                        this.reset(span);
                    },

                    reset(span) {
                        if (span.dataset.original) {
                            span.innerText = span.dataset.original;
                        }
                        span.style.color = ''; // Reset to inherited
                        this.fontClasses.forEach(c => span.classList.remove(c));
                    },

                    loopFont(span) {
                        const tick = () => {
                            // Change Font
                            this.fontClasses.forEach(fontClass => span.classList.remove(fontClass));
                            const randomIndex = Math.floor(Math.random() * this.fontClasses.length);
                            span.classList.add(this.fontClasses[randomIndex]);

                            // Chance to change to Katakana
                            if (Math.random() < 0.05) {
                                const originalChar = span.dataset.original.toUpperCase();
                                if (this.katakanaMap[originalChar]) {
                                    span.innerText = this.katakanaMap[originalChar];
                                }
                            } else {
                                span.innerText = span.dataset.original;
                            }

                            // Schedule next tick
                            const interval = Math.floor(Math.random() * (700 - 300 + 1)) + 300;
                            span._fontTimeout = setTimeout(tick, interval);
                        };
                        tick();
                    },

                    loopColor(span) {
                        const tick = () => {
                            // Change Color
                            const randomColorIndex = Math.floor(Math.random() * this.colors.length);
                            span.style.color = this.colors[randomColorIndex];

                            // Schedule next tick
                            const interval = Math.floor(Math.random() * (1500 - 800 + 1)) + 800;
                            span._colorTimeout = setTimeout(tick, interval);
                        };
                        tick();
                    }
                };

                // Initialize Title Spans (Continuous)
                const titleSpans = wrapper.querySelectorAll('.text-block1 .span-class');
                titleSpans.forEach(span => {
                    Glitch.start(span);
                });

                // Fetch GitHub Directory using git trees API
                const container = wrapper.querySelector('#button-container');
                const apiUrl = 'https://api.github.com/repos/cju-media/Scores/git/trees/main?recursive=1';
                const repoUrlBase = 'https://github.com/cju-media/Scores/tree/main/Arrangements/';

                // Build a glitchy repo-button styled item, matching the arrangement list buttons
                function buildGlitchButton(labelText) {
                    const link = document.createElement('a');
                    link.className = 'repo-button';

                    for (let char of labelText) {
                        const span = document.createElement('span');
                        span.textContent = char;
                        span.className = 'button-char';
                        span.dataset.original = char;
                        link.appendChild(span);
                    }

                    link.addEventListener('mouseenter', () => {
                        link.querySelectorAll('.button-char').forEach(span => Glitch.start(span, false));
                    });
                    link.addEventListener('mouseleave', () => {
                        link.querySelectorAll('.button-char').forEach(span => Glitch.stop(span));
                    });

                    return link;
                }

                // Standard orchestral score order (top of the score to the bottom).
                // More specific terms are matched before generic ones (longest-first).
                const ORCHESTRAL_ORDER = [
                    'piccolo', 'alto flute', 'flute',
                    'oboe d\'amore', 'oboe', 'english horn', 'cor anglais',
                    'e-flat clarinet', 'bass clarinet', 'contrabass clarinet', 'clarinet',
                    'contrabassoon', 'double bassoon', 'bassoon',
                    'soprano saxophone', 'alto saxophone', 'tenor saxophone', 'baritone saxophone', 'saxophone',
                    'horn in f', 'french horn', 'horn',
                    'piccolo trumpet', 'trumpet', 'cornet', 'flugelhorn',
                    'bass trombone', 'alto trombone', 'trombone',
                    'euphonium', 'baritone horn',
                    'tuba', 'contrabass tuba',
                    'timpani',
                    'snare drum', 'bass drum', 'cymbals', 'tam-tam', 'triangle', 'tambourine', 'woodblock', 'percussion',
                    'glockenspiel', 'xylophone', 'vibraphone', 'marimba', 'tubular bells', 'crotales', 'mallets',
                    'melodica',
                    'harp',
                    'piano', 'celesta', 'celeste', 'harpsichord', 'organ',
                    'synthesizer', 'synth', 'keyboard', 'laptop', 'electronics', 'tape',
                    'electric guitar', 'bass guitar', 'guitar',
                    'soprano', 'mezzo-soprano', 'mezzo soprano', 'countertenor', 'contralto', 'alto',
                    'tenor', 'bass-baritone', 'baritone', 'bass', 'voice', 'vocal',
                    'choir', 'chorus', 'satb',
                    'violin ii', 'violin 2', 'violin i', 'violin 1', 'violin',
                    'viola', 'violoncello', 'cello',
                    'double bass', 'contrabass', 'string bass'
                ];
                const ORCHESTRAL_ORDER_BY_LENGTH = ORCHESTRAL_ORDER.slice().sort((a, b) => b.length - a.length);

                function orchestralRank(label) {
                    // For combined parts ("Flute and Mezzo-Soprano") rank by the first-listed instrument
                    const s = label.toLowerCase().split(/\s+(?:and|&|\+|\/|,)\s+/)[0].trim();
                    for (const key of ORCHESTRAL_ORDER_BY_LENGTH) {
                        if (s.indexOf(key) !== -1) return ORCHESTRAL_ORDER.indexOf(key);
                    }
                    return 999; // Unknown instruments sort to the end (alphabetically among themselves)
                }

                let currentPartsFiles = [];
                let currentPartsSort = 'score'; // 'score' = orchestral order, 'alpha' = A-Z

                function renderPartsList() {
                    const list = document.getElementById('parts-list-container');
                    if (!list) return;
                    list.innerHTML = '';

                    const sorted = currentPartsFiles.slice().sort((a, b) => {
                        if (currentPartsSort === 'score') {
                            const diff = orchestralRank(a.label) - orchestralRank(b.label);
                            if (diff !== 0) return diff;
                        }
                        return a.label.localeCompare(b.label, undefined, { numeric: true });
                    });

                    sorted.forEach(part => {
                        const link = buildGlitchButton(part.label);
                        link.href = part.url;
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                        list.appendChild(link);
                    });
                }

                function updatePartsSortUI() {
                    document.querySelectorAll('#parts-sort-toggle button').forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.sort === currentPartsSort);
                    });
                }

                // Function to open the Parts modal with one item per part
                function openPartsModal(titleText, partsFiles) {
                    const modal = document.getElementById('parts-modal-overlay');
                    if (!modal) return;

                    const title = document.getElementById('parts-modal-title');
                    if (title) title.textContent = titleText + ' \u2014 Parts';

                    currentPartsFiles = partsFiles;
                    currentPartsSort = 'score';
                    updatePartsSortUI();
                    renderPartsList();

                    modal.style.display = 'flex';
                    document.body.style.overflow = 'hidden';
                }

                // Parts modal close logic
                const partsOverlay = document.getElementById('parts-modal-overlay');
                if (partsOverlay) {
                    const partsCloseBtn = document.getElementById('parts-modal-close');
                    const closePartsModal = () => {
                        partsOverlay.style.display = 'none';
                        document.body.style.overflow = '';
                    };

                    if (partsCloseBtn) partsCloseBtn.addEventListener('click', closePartsModal);
                    partsOverlay.addEventListener('click', (e) => {
                        if (e.target === partsOverlay) closePartsModal();
                    });

                    document.querySelectorAll('#parts-sort-toggle button').forEach(btn => {
                        btn.addEventListener('click', () => {
                            currentPartsSort = btn.dataset.sort;
                            updatePartsSortUI();
                            renderPartsList();
                        });
                    });

                    if (!window.arrangementsPartsKeydownAttached) {
                        document.addEventListener('keydown', (e) => {
                            if (partsOverlay.style.display === 'flex' && e.key === 'Escape') {
                                closePartsModal();
                            }
                        });
                        window.arrangementsPartsKeydownAttached = true;
                    }
                }

                fetch(apiUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`GitHub API Error: ${response.statusText}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        container.innerHTML = ''; // Clear loading message

                        const tree = data.tree || [];
                        const directoriesData = {};

                        tree.forEach(item => {
                            if (item.path.startsWith('Arrangements/')) {
                                const relativePath = item.path.substring(13); // Remove 'Arrangements/' prefix
                                const parts = relativePath.split('/');

                                if (parts.length > 0) {
                                    const dirName = parts[0];
                                    if (dirName && dirName !== '') {
                                        if (!directoriesData[dirName]) {
                                            directoriesData[dirName] = { files: [], path: dirName };
                                        }
                                        if (parts.length > 1) {
                                            // It's a file inside the directory
                                            directoriesData[dirName].files.push({
                                                name: parts.slice(1).join('/'),
                                                path: item.path,
                                                type: item.type
                                            });
                                        }
                                    }
                                }
                            }
                        });

                        const directories = Object.values(directoriesData);

                        if (directories.length === 0) {
                            container.innerHTML = '<div class="loading">No arrangements found.</div>';
                            return;
                        }

                        directories.forEach(dir => {
                            const link = document.createElement('a');
                            link.href = repoUrlBase + encodeURIComponent(dir.path);
                            link.className = 'repo-button';
                            link.target = '_blank';
                            link.rel = 'noopener noreferrer';

                            // Build spans for button text
                            const text = dir.path;
                            for (let char of text) {
                                const span = document.createElement('span');
                                span.textContent = char;
                                span.className = 'button-char';
                                // Pre-set original for Glitch object logic
                                span.dataset.original = char;
                                link.appendChild(span);
                            }

                            // Interactive Glitch on Hover
                            link.addEventListener('mouseenter', () => {
                                const chars = link.querySelectorAll('.button-char');
                                chars.forEach(span => Glitch.start(span, false)); // false = disable color glitch
                            });

                            link.addEventListener('mouseleave', () => {
                                const chars = link.querySelectorAll('.button-char');
                                chars.forEach(span => Glitch.stop(span));
                            });

                            // Collect individual part files (PDFs living inside the 'Parts' folder)
                            const partsFiles = dir.files
                                .filter(f => f.name.toLowerCase().startsWith('parts/') && f.name.toLowerCase().endsWith('.pdf'))
                                .map(f => {
                                    const subPath = f.name.substring(f.name.indexOf('/') + 1); // strip 'Parts/'
                                    const baseName = subPath.replace(/\.pdf$/i, '');
                                    const label = baseName.split(' - ').pop().trim() || baseName;
                                    return {
                                        label: label,
                                        url: `https://cdn.jsdelivr.net/gh/cju-media/Scores@main/Arrangements/${encodeURIComponent(dir.path)}/Parts/${encodeURIComponent(subPath)}`
                                    };
                                });

                            // If this arrangement has parts, clicking the button opens the parts modal
                            if (partsFiles.length) {
                                link.addEventListener('click', (e) => {
                                    e.preventDefault();
                                    openPartsModal(dir.path, partsFiles);
                                });
                            }

                            container.appendChild(link);
                        });
                    })
                    .catch(error => {
                        console.error('Error fetching arrangements:', error);
                        container.innerHTML = `<div class="loading" style="color: red;">Error loading arrangements. Please try again later.</div>`;
                    });
            }

            // Initialization logic for Squarespace
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initArrangements);
            } else {
                initArrangements();
            }
        })();
    </script>
</div>
