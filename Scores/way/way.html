<!-- Way Page Fragment -->
<div id="way-page-wrapper">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display&family=VT323&display=swap');

        /* Scoped Styles */
        #way-page-wrapper {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: auto;
            margin: 0;
            background-color: transparent; /* Inherit from Squarespace */
            padding: 60px 20px 20px 20px;
            box-sizing: border-box;
        }

        /* Glitch font classes */
        #way-page-wrapper .font1 { font-family: Arial, sans-serif !important; }
        #way-page-wrapper .font2 { font-family: Times New Roman, serif !important; }
        #way-page-wrapper .font3 { font-family: Courier New, monospace !important; }
        #way-page-wrapper .font4 { font-family: essay-text, monospace !important; }
        #way-page-wrapper .font5 { font-family: 'Playfair Display', serif !important; }
        #way-page-wrapper .font6 { font-family: 'VT323', monospace !important; transform: scale(1.1); }

        #way-page-wrapper h1 {
            font-size: min(5vw, 3rem);
            text-align: center;
            display: flex;
            justify-content: center;
            flex-wrap: nowrap;
            margin-bottom: 40px;
            color: inherit; /* Inherit text color */
        }

        #way-page-wrapper .text-block1 {
            padding-bottom: 25px;
        }

        #way-page-wrapper .span-class {
            display: inline-block;
            width: 1.2em;
            text-align: center;
            vertical-align: bottom;
            line-height: 1.2;
        }

        /* Layout Styles */
        #way-page-wrapper .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            gap: 40px;
            padding: 20px;
        }

        #way-page-wrapper #text-container {
            width: 100%;
            max-width: 800px;
            text-align: center;
            /* font-family: 'Playfair Display', serif; */
            /* font-size: 1.2rem; */
            line-height: 1.6;
            color: inherit; /* Inherit text color */
        }

        #way-page-wrapper #button-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        /* Mobile / Vertical Styles */
        @media (max-width: 768px) {
            #way-page-wrapper #text-container {
                margin-bottom: 20px;
            }
        }

        /* Button Styles */
        #way-page-wrapper .repo-button {
            display: block;
            padding: 15px 20px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            text-align: center;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #way-page-wrapper .repo-button:hover {
            background-color: #555;
            transform: scale(1.02);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }

        /* Button Character Styles - to prevent jitter */
        #way-page-wrapper .button-char {
            display: inline-block;
            width: 0.6em;
            text-align: center;
            vertical-align: bottom;
        }

        #way-page-wrapper .loading {
            font-family: monospace;
            color: #666;
            font-size: 1.2rem;
        }

        /* Modal Styles */
        #midi-modal-overlay {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }

        #midi-modal-content {
            background-color: #1a1a1a;
            color: #fff;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 800px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #333;
        }

        #midi-modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #ccc;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
            background: none;
            border: none;
            padding: 0;
        }

        #midi-modal-close:hover {
            color: #fff;
        }

        #midi-modal-title {
            margin-top: 0;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            text-align: center;
            width: 100%;
        }

        /* html-midi-player custom styling via CSS variables */
        midi-player {
            display: block;
            width: 100%;
            margin-bottom: 15px;
        }

        .visualizers-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        midi-visualizer {
            display: block;
            width: 100%;
            height: 300px;
            background: #fff; /* Staff needs white background to see the notes clearly */
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #333;
        }

        @media (max-width: 768px) {
            #midi-modal-content {
                padding: 20px 15px;
            }
            midi-visualizer {
                height: 200px;
            }
        }
    </style>

    <!-- MIDI Modal -->
    <div id="midi-modal-overlay">
        <div id="midi-modal-content">
            <button id="midi-modal-close">&times;</button>
            <h2 id="midi-modal-title">MIDI Player</h2>
            <midi-player id="way-midi-player" sound-font visualizer="#way-midi-staff"></midi-player>
            <div class="visualizers-container">
                <midi-visualizer id="way-midi-staff" type="staff"></midi-visualizer>
            </div>
        </div>
    </div>

    <div class="text-block1">
        <h1>
            <span class="span-class">T</span>
            <span class="span-class">H</span>
            <span class="span-class">E</span>
            <span class="span-class">&nbsp;</span>
            <span class="span-class">W</span>
            <span class="span-class">A</span>
            <span class="span-class">Y</span>
        </h1>
    </div>

    <div class="content-wrapper">
        <div id="text-container">
            <p>
              A collection of folders on the way.
            </p>
        </div>

        <div id="button-container">
            <div class="loading">Loading The Way folders...</div>
        </div>
    </div>

    <script>
        (function() {
            function initWay() {
                // Prevent double initialization
                if (window.wayInitialized) return;
                window.wayInitialized = true;

                // Load MIDI Player scripts
                if (!window.midiScriptsLoaded) {
                    const script = document.createElement('script');
                    script.src = "https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.5.0";
                    document.body.appendChild(script);
                    window.midiScriptsLoaded = true;
                }

                // Glitch Effect Logic
                const wrapper = document.getElementById('way-page-wrapper');
                if (!wrapper) return; // Guard clause

                const Glitch = {
                    fontClasses: ['font1', 'font2', 'font3', 'font4', 'font5', 'font6'],
                    colors: ['#2F4F4F', '#4B0082', '#8B0000', '#000080', '#556B2F', '#8B4513', '#2E0854', '#191970'],
                    katakanaMap: {
                        'A': 'ア', 'B': 'ブ', 'C': 'ク', 'D': 'デ', 'E': 'エ',
                        'F': 'フ', 'G': 'グ', 'H': 'ハ', 'I': 'イ', 'J': 'ジ',
                        'K': 'ケ', 'L': 'ル', 'M': 'ム', 'N': 'ン', 'O': 'オ',
                        'P': 'プ', 'Q': 'キュ', 'R': 'ラ', 'S': 'ス', 'T': 'ト',
                        'U': '牛', 'V': 'ヴ', 'W': 'ワ', 'X': 'クス', 'Y': 'ヤ', 'Z': 'ズ'
                    },

                    start(span, enableColor = true) {
                        if (!span.dataset.original) {
                            span.dataset.original = span.innerText;
                        }
                        this.loopFont(span);
                        if (enableColor) {
                            this.loopColor(span);
                        }
                    },

                    stop(span) {
                        clearTimeout(span._fontTimeout);
                        clearTimeout(span._colorTimeout);
                        this.reset(span);
                    },

                    reset(span) {
                        if (span.dataset.original) {
                            span.innerText = span.dataset.original;
                        }
                        span.style.color = ''; // Reset to inherited
                        this.fontClasses.forEach(c => span.classList.remove(c));
                    },

                    loopFont(span) {
                        const tick = () => {
                            // Change Font
                            this.fontClasses.forEach(fontClass => span.classList.remove(fontClass));
                            const randomIndex = Math.floor(Math.random() * this.fontClasses.length);
                            span.classList.add(this.fontClasses[randomIndex]);

                            // Chance to change to Katakana
                            if (Math.random() < 0.05) {
                                const originalChar = span.dataset.original.toUpperCase();
                                if (this.katakanaMap[originalChar]) {
                                    span.innerText = this.katakanaMap[originalChar];
                                }
                            } else {
                                span.innerText = span.dataset.original;
                            }

                            // Schedule next tick
                            const interval = Math.floor(Math.random() * (700 - 300 + 1)) + 300;
                            span._fontTimeout = setTimeout(tick, interval);
                        };
                        tick();
                    },

                    loopColor(span) {
                        const tick = () => {
                            // Change Color
                            const randomColorIndex = Math.floor(Math.random() * this.colors.length);
                            span.style.color = this.colors[randomColorIndex];

                            // Schedule next tick
                            const interval = Math.floor(Math.random() * (1500 - 800 + 1)) + 800;
                            span._colorTimeout = setTimeout(tick, interval);
                        };
                        tick();
                    }
                };

                // Initialize Title Spans (Continuous)
                const titleSpans = wrapper.querySelectorAll('.text-block1 .span-class');
                titleSpans.forEach(span => {
                    // Skip glitch on spaces
                    if (span.innerText.trim() !== '') {
                        Glitch.start(span);
                    }
                });

                // Fetch GitHub Directory
                const container = wrapper.querySelector('#button-container');
                const apiUrl = 'https://api.github.com/repos/cju-media/Scores/contents/The%20Way?ref=main';
                const repoUrlBase = 'https://github.com/cju-media/Scores/tree/main/The%20Way/';

                fetch(apiUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`GitHub API Error: ${response.statusText}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        container.innerHTML = ''; // Clear loading message

                        // Filter for directories, exclude TEMPLATES
                        let directories = data.filter(item => item.type === 'dir' && item.name.toUpperCase() !== 'TEMPLATES' && item.name.toUpperCase() !== 'TEMPLATE');

                        if (directories.length === 0) {
                            container.innerHTML = '<div class="loading">No folders found.</div>';
                            return;
                        }

                        // Sort directories from newest to oldest based on MM-DD-YY naming convention
                        directories.sort((a, b) => {
                            const parseDateStr = (str) => {
                                const parts = str.split('-');
                                if (parts.length === 3) {
                                    // Parse as MM-DD-YY. Note: YY is assumed to be 2000+
                                    return new Date(`20${parts[2]}-${parts[0]}-${parts[1]}`);
                                }
                                return new Date(0); // Fallback for unparseable names
                            };
                            return parseDateStr(b.name) - parseDateStr(a.name);
                        });

                        directories.forEach(dir => {
                            const link = document.createElement('a');
                            link.href = '#';
                            link.className = 'repo-button';
                            // link.target = '_blank';
                            // link.rel = 'noopener noreferrer';

                            // Build spans for button text
                            const text = dir.name;
                            for (let char of text) {
                                const span = document.createElement('span');
                                span.textContent = char;
                                span.className = 'button-char';
                                // Pre-set original for Glitch object logic
                                span.dataset.original = char;
                                link.appendChild(span);
                            }

                            // Interactive Glitch on Hover
                            link.addEventListener('mouseenter', () => {
                                const chars = link.querySelectorAll('.button-char');
                                chars.forEach(span => {
                                    if (span.dataset.original.trim() !== '') {
                                        Glitch.start(span, false);
                                    }
                                });
                            });

                            link.addEventListener('mouseleave', () => {
                                const chars = link.querySelectorAll('.button-char');
                                chars.forEach(span => Glitch.stop(span));
                            });

                            // Click handler to open MIDI modal
                            let isFetching = false;
                            link.addEventListener('click', (e) => {
                                e.preventDefault();
                                if (isFetching) return;

                                const dirContentsUrl = `https://api.github.com/repos/cju-media/Scores/contents/The%20Way/${encodeURIComponent(dir.name)}?ref=main`;

                                isFetching = true;
                                const originalText = link.innerText;
                                // Temporarily show loading without destroying spans
                                link.style.color = '#888';

                                fetch(dirContentsUrl)
                                    .then(res => {
                                        if(!res.ok) throw new Error("Failed to fetch dir contents");
                                        return res.json();
                                    })
                                    .then(files => {
                                        const midiFile = files.find(f => f.name.toLowerCase().endsWith('.mid') || f.name.toLowerCase().endsWith('.midi'));
                                        if (midiFile) {
                                            const rawMidiUrl = `https://raw.githubusercontent.com/cju-media/Scores/main/The%20Way/${encodeURIComponent(dir.name)}/${encodeURIComponent(midiFile.name)}`;
                                            openMidiModal(rawMidiUrl, dir.name);
                                        } else {
                                            alert("No MIDI file found in this folder.");
                                        }
                                    })
                                    .catch(err => {
                                        console.error(err);
                                        alert("Error fetching folder contents. You may have hit the GitHub API rate limit, please try again later.");
                                    })
                                    .finally(() => {
                                        isFetching = false;
                                        link.style.color = ''; // Restore original color via CSS
                                        const chars = link.querySelectorAll('.button-char');
                                        chars.forEach(span => Glitch.reset(span)); // Ensure spans are back to normal if glitch stopped
                                    });
                            });

                            container.appendChild(link);
                        });
                    })
                    .catch(error => {
                        console.error('Error fetching The Way folders:', error);
                        container.innerHTML = `<div class="loading" style="color: red;">Error loading folders. Please try again later.</div>`;
                    });

                // Function to handle opening the MIDI modal
                function openMidiModal(midiUrl, titleText) {
                    const modal = document.getElementById('midi-modal-overlay');
                    if (!modal) return;

                    const player = document.getElementById('way-midi-player');
                    const staff = document.getElementById('way-midi-staff');
                    const title = document.getElementById('midi-modal-title');

                    if (player && staff) {
                        player.setAttribute('src', midiUrl);
                        // Force a reload of visualizers array via attribute reset
                        player.setAttribute('visualizer', '#way-midi-staff');

                        // Reset player just in case
                        if(player.playing) {
                            player.stop();
                        }
                    }
                    if (title) {
                        title.textContent = titleText;
                    }

                    modal.style.display = 'flex';
                }

                // Add close modal functionality
                const modalOverlay = document.getElementById('midi-modal-overlay');
                if (modalOverlay) {
                    const closeBtn = document.getElementById('midi-modal-close');
                    const closeModal = () => {
                        modalOverlay.style.display = 'none';
                        const player = document.getElementById('way-midi-player');
                        if (player && player.playing) {
                            player.stop();
                        }
                    };

                    if (closeBtn) {
                        closeBtn.addEventListener('click', closeModal);
                    }
                    modalOverlay.addEventListener('click', (e) => {
                        if (e.target === modalOverlay) {
                            closeModal();
                        }
                    });
                }
            }

            // Initialization logic for Squarespace
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initWay);
            } else {
                initWay();
            }
        })();
    </script>
</div>
