<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Way Block Loader</title>
</head>
<body>
    <div id="way-target-container"></div>
    <script>
        // Fetch the HTML fragment from the raw GitHub URL
        // Using way/way.html under Scores repository.
        const url = 'https://cdn.jsdelivr.net/gh/cju-media/personal-website@main/Scores/way/way.html';

        fetch(url)
            .then(response => {
                if (!response.ok) throw new Error("Network response was not ok");
                return response.text();
            })
            .then(html => {
                const container = document.getElementById('way-target-container');
                container.innerHTML = html;

                // Manually execute scripts inserted via innerHTML
                const scripts = container.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            })
            .catch(error => console.error('Error loading The Way block:', error));
    </script>
</body>
</html>
