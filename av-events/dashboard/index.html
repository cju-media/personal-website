<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AV Events Upload Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 30px 16px 60px;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 560px;
            width: 100%;
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 22px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: -8px;
            margin-bottom: 24px;
        }
        .form-row { margin-bottom: 18px; }
        .form-row label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            color: #444;
            margin-bottom: 6px;
        }
        .form-row input[type="text"],
        .form-row input[type="date"],
        .form-row textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px;
        }
        .form-row textarea {
            min-height: 110px;
            resize: vertical;
        }
        .photo-zone {
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 24px 16px;
            background-color: #f0f8ff;
            text-align: center;
            cursor: pointer;
        }
        .photo-zone.dragover {
            background-color: #e1f0fa;
            border-color: #2980b9;
        }
        .photo-zone p { margin: 4px 0; color: #555; font-size: 14px; }
        .file-input { display: none; }
        .thumb-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            margin-top: 14px;
        }
        .thumb {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 6px;
            overflow: hidden;
            background: #eee;
        }
        .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .thumb .remove-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 8px;
            font-weight: bold;
        }
        .btn:hover { background-color: #2980b9; }
        .btn:disabled { background-color: #a9c9de; cursor: not-allowed; }
        #status {
            margin-top: 16px;
            font-weight: bold;
            min-height: 20px;
            font-size: 14px;
            text-align: center;
        }
        .error { color: #e74c3c; }
        .success { color: #2ecc71; }
        .info { color: #3498db; }

        .menu-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #555;
        }
        .top-bar { position: relative; }
        .pat-container {
            display: none;
            position: absolute;
            top: 44px;
            right: 0;
            background: white;
            padding: 18px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-size: 0.9em;
            color: #666;
            z-index: 999;
            width: 280px;
            text-align: left;
            border: 1px solid #ddd;
        }
        .pat-container.show { display: block; }
        #pat-input {
            padding: 8px;
            width: 100%;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .link-row {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
        }
        .link-row a { color: #3498db; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h1>AV Events Upload</h1>
        <button class="menu-btn" id="menu-btn" aria-label="Settings">&#9881;</button>
        <div class="pat-container" id="pat-menu">
            <h3 style="margin-top: 0; color: #333; font-size: 15px;">GitHub Access</h3>
            <p style="margin-bottom: 12px;">Requires a GitHub Personal Access Token (fine-grained, scoped to <code>personal-website</code> only, Contents: Read &amp; write).</p>
            <input type="password" id="pat-input" placeholder="Enter GitHub PAT">
            <button class="btn" style="font-size: 14px; padding: 9px;" onclick="savePAT()">Save</button>
        </div>
    </div>
    <p class="subtitle">Add a new event &mdash; it'll appear on /av-events after processing (usually within a minute).</p>

    <form id="event-form">
        <div class="form-row">
            <label for="event-title">Event Title</label>
            <input type="text" id="event-title" placeholder="e.g. FCCLA Nationals AV Setup" required>
        </div>

        <div class="form-row">
            <label for="event-date">Date</label>
            <input type="date" id="event-date" required>
        </div>

        <div class="form-row">
            <label for="event-location">Location (optional)</label>
            <input type="text" id="event-location" placeholder="e.g. Anaheim, CA">
        </div>

        <div class="form-row">
            <label for="event-description">Description</label>
            <textarea id="event-description" placeholder="What happened, what you set up, how it went..." required></textarea>
        </div>

        <div class="form-row">
            <label>Photos</label>
            <div class="photo-zone" id="photo-zone">
                <p><strong>Tap to add photos</strong></p>
                <p>or take a new one now</p>
                <input type="file" class="file-input" id="photo-input" accept="image/*" multiple>
            </div>
            <div class="thumb-grid" id="thumb-grid"></div>
        </div>

        <button type="submit" class="btn" id="submit-btn">Add Event</button>
    </form>

    <div id="status"></div>

    <div class="link-row">
        <a href="https://raw.githack.com/cju-media/personal-website/main/av-events/av-events.html" target="_blank" rel="noopener noreferrer">Preview live page &#8594;</a>
    </div>
</div>

<script>
    const REPO = 'cju-media/personal-website';
    const QUEUE_PATH = 'av-events/uploads_queue';
    const PAT_KEY = 'AV_EVENTS_GITHUB_PAT';

    const statusDiv = document.getElementById('status');
    const menuBtn = document.getElementById('menu-btn');
    const patMenu = document.getElementById('pat-menu');
    const patInput = document.getElementById('pat-input');
    const form = document.getElementById('event-form');
    const submitBtn = document.getElementById('submit-btn');
    const photoZone = document.getElementById('photo-zone');
    const photoInput = document.getElementById('photo-input');
    const thumbGrid = document.getElementById('thumb-grid');
    const dateInput = document.getElementById('event-date');

    // Default date to today
    dateInput.value = new Date().toISOString().slice(0, 10);

    // Load saved PAT
    const savedPat = localStorage.getItem(PAT_KEY);
    if (savedPat) patInput.value = savedPat;

    menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        patMenu.classList.toggle('show');
    });
    document.addEventListener('click', (e) => {
        if (!patMenu.contains(e.target) && e.target !== menuBtn) {
            patMenu.classList.remove('show');
        }
    });

    function savePAT() {
        const pat = patInput.value.trim();
        if (pat) {
            localStorage.setItem(PAT_KEY, pat);
            setStatus('PAT saved on this device.', 'success');
        } else {
            localStorage.removeItem(PAT_KEY);
            setStatus('PAT removed.', 'info');
        }
        patMenu.classList.remove('show');
    }

    function setStatus(msg, type) {
        statusDiv.textContent = msg;
        statusDiv.className = type || '';
    }

    // ---- Photo selection & client-side resize/preview ----
    let selectedPhotos = []; // [{ blob, previewUrl }]

    photoZone.addEventListener('click', () => photoInput.click());
    photoZone.addEventListener('dragover', (e) => { e.preventDefault(); photoZone.classList.add('dragover'); });
    photoZone.addEventListener('dragleave', () => photoZone.classList.remove('dragover'));
    photoZone.addEventListener('drop', (e) => {
        e.preventDefault();
        photoZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) addPhotos(Array.from(e.dataTransfer.files));
    });
    photoInput.addEventListener('change', () => {
        if (photoInput.files.length) addPhotos(Array.from(photoInput.files));
        photoInput.value = '';
    });

    // Resize/re-encode via canvas so large phone photos (and HEIC on Safari,
    // which can decode it into an <img>) come out as reasonably-sized JPEGs
    // regardless of source format.
    function resizeImage(file, maxDim = 2000, quality = 0.85) {
        return new Promise((resolve) => {
            const img = new Image();
            const objectUrl = URL.createObjectURL(file);
            img.onload = () => {
                let { width, height } = img;
                if (width > maxDim || height > maxDim) {
                    if (width > height) {
                        height = Math.round(height * (maxDim / width));
                        width = maxDim;
                    } else {
                        width = Math.round(width * (maxDim / height));
                        height = maxDim;
                    }
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                URL.revokeObjectURL(objectUrl);
                canvas.toBlob((blob) => {
                    resolve(blob || file); // fall back to original if encoding fails
                }, 'image/jpeg', quality);
            };
            img.onerror = () => {
                URL.revokeObjectURL(objectUrl);
                resolve(file); // fall back to original (e.g. format canvas can't decode)
            };
            img.src = objectUrl;
        });
    }

    async function addPhotos(files) {
        for (const file of files) {
            if (!file.type.startsWith('image/') && !/\.(heic|heif)$/i.test(file.name)) continue;
            setStatus(`Processing ${file.name}...`, 'info');
            const blob = await resizeImage(file);
            const previewUrl = URL.createObjectURL(blob);
            selectedPhotos.push({ blob, previewUrl });
            renderThumbs();
        }
        setStatus('', '');
    }

    function renderThumbs() {
        thumbGrid.innerHTML = '';
        selectedPhotos.forEach((p, idx) => {
            const thumb = document.createElement('div');
            thumb.className = 'thumb';

            const img = document.createElement('img');
            img.src = p.previewUrl;
            thumb.appendChild(img);

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'remove-btn';
            removeBtn.textContent = '×';
            removeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                URL.revokeObjectURL(p.previewUrl);
                selectedPhotos.splice(idx, 1);
                renderThumbs();
            });
            thumb.appendChild(removeBtn);

            thumbGrid.appendChild(thumb);
        });
    }

    // ---- Upload on submit ----
    function blobToBase64(blob) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    }

    async function putFile(path, base64Content, message, pat) {
        const response = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${pat}`,
                'Content-Type': 'application/json',
                'Accept': 'application/vnd.github.v3+json'
            },
            body: JSON.stringify({ content: base64Content, message })
        });
        if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.message || response.statusText);
        }
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const pat = localStorage.getItem(PAT_KEY);
        if (!pat) {
            setStatus('Error: GitHub PAT is required. Tap ⚙ to add one.', 'error');
            patMenu.classList.add('show');
            return;
        }

        const title = document.getElementById('event-title').value.trim();
        const date = document.getElementById('event-date').value;
        const location = document.getElementById('event-location').value.trim();
        const description = document.getElementById('event-description').value.trim();

        if (!title || !date || !description) {
            setStatus('Please fill in title, date, and description.', 'error');
            return;
        }
        if (selectedPhotos.length === 0) {
            setStatus('Add at least one photo.', 'error');
            return;
        }

        submitBtn.disabled = true;
        const submissionId = Date.now().toString();

        try {
            // 1. Upload photos first (meta.json goes last, as the "ready" signal
            //    the processing workflow looks for).
            for (let i = 0; i < selectedPhotos.length; i++) {
                setStatus(`Uploading photo ${i + 1} of ${selectedPhotos.length}...`, 'info');
                const base64 = await blobToBase64(selectedPhotos[i].blob);
                const filename = `photo-${String(i + 1).padStart(2, '0')}.jpg`;
                await putFile(
                    `${QUEUE_PATH}/${submissionId}/photos/${filename}`,
                    base64,
                    `Queue photo ${filename} for AV event "${title}" via web UI`,
                    pat
                );
            }

            // 2. Upload metadata last -- this is what tells the processing
            //    workflow the submission is complete and ready to publish.
            setStatus('Saving event details...', 'info');
            const meta = { title, date, location, description };
            const metaBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(meta, null, 2))));
            await putFile(
                `${QUEUE_PATH}/${submissionId}/meta.json`,
                metaBase64,
                `Queue AV event "${title}" via web UI`,
                pat
            );

            setStatus('Event submitted! It will appear on /av-events shortly.', 'success');
            form.reset();
            dateInput.value = new Date().toISOString().slice(0, 10);
            selectedPhotos.forEach(p => URL.revokeObjectURL(p.previewUrl));
            selectedPhotos = [];
            renderThumbs();
        } catch (err) {
            console.error(err);
            if (String(err.message).includes('Bad credentials')) {
                setStatus('Error: Invalid GitHub PAT.', 'error');
            } else {
                setStatus(`Upload failed: ${err.message}`, 'error');
            }
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
