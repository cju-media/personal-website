<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AV Events Block Loader</title>
</head>
<body>
    <div id="target-container">Loading events...</div>
    <script>
        // Fetch the HTML fragment from raw GitHub content via githack for correct MIME types.
        const url = 'https://raw.githack.com/cju-media/personal-website/main/av-events/av-events.html?t=' + Date.now();

        fetch(url)
            .then(response => {
                if (!response.ok) throw new Error("Network response was not ok");
                return response.text();
            })
            .then(html => {
                const container = document.getElementById('target-container');
                container.innerHTML = html;

                // Manually execute scripts inserted via innerHTML
                const scripts = container.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            })
            .catch(error => {
                console.error('Error loading AV Events:', error);
                document.getElementById('target-container').innerHTML = 'Updating... (Refresh in a moment)';
            });
    </script>
</body>
</html>
