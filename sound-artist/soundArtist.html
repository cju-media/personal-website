<div id="sound-artist-page-wrapper">
    <style>
        #sound-artist-page-wrapper {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            color: inherit;
        }
        #sound-artist-page-wrapper button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
            margin-right: 10px;
        }
        #sound-artist-page-wrapper button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
        #sound-artist-page-wrapper button:hover:not(:disabled) {
            background-color: #555;
        }
        #sound-artist-page-wrapper #status {
            margin-top: 15px;
            font-style: italic;
        }
    </style>
    <h1>Sound Artist</h1>
    <p>RNBO Patch</p>
    <button id="start-audio" disabled>Loading Library...</button>
    <br>
    <button id="play-sample" disabled>Play Random Sample</button>
    <button id="play-oscillator" disabled>Play Oscillator</button>
    <div id="status">Initializing...</div>

    <script>
    (function() {
        var wrapper = document.getElementById('sound-artist-page-wrapper');
        if (!wrapper) return;

        var startBtn = wrapper.querySelector('#start-audio');
        var playSampleBtn = wrapper.querySelector('#play-sample');
        var playOscBtn = wrapper.querySelector('#play-oscillator');
        var statusDiv = wrapper.querySelector('#status');

        var audioContext;
        var device;
        var patcherData;

        var REPO_ROOT = 'https://raw.githubusercontent.com/cju-media/personal-website/main/sound-artist/sound/';
        var EXPORT_URL = REPO_ROOT + 'rnbo-export/sound-artist.export.json';
        var ASSETS_URL = REPO_ROOT + 'assets/';

        var SAMPLE_ASSETS = [
            'epno.aiff',
            'eroica.aiff',
            'isthatyou.aiff',
            'sacre.aiff',
            'snare.aiff'
        ];

        // Exposed init function for onload callback
        window.initSoundArtist = function() {
            startBtn.textContent = 'Start Audio Engine';
            startBtn.disabled = false;
            statusDiv.textContent = 'Library loaded. Fetching patch...';
            loadPatcher();
        };

        // Exposed error handler
        window.rnboError = function() {
            statusDiv.textContent = 'Error: Failed to load RNBO library.';
            statusDiv.style.color = 'red';
        };

        async function loadPatcher() {
            try {
                var patcherResponse = await fetch(EXPORT_URL);
                if (!patcherResponse.ok) {
                    throw new Error(`Failed to load patch: ${patcherResponse.status} ${patcherResponse.statusText}`);
                }
                patcherData = await patcherResponse.json();
                statusDiv.textContent = 'Patch fetched. Ready to start.';
            } catch (err) {
                console.error(err);
                statusDiv.textContent = 'Fetch Error: ' + err.message;
            }
        }

        async function loadBuffer(url) {
            try {
                var audioResponse = await fetch(url);
                if (!audioResponse.ok) {
                    throw new Error(`Failed to load audio file: ${audioResponse.statusText}`);
                }
                var arrayBuffer = await audioResponse.arrayBuffer();
                return await audioContext.decodeAudioData(arrayBuffer);
            } catch (err) {
                console.error("Buffer load error:", err);
                throw err;
            }
        }

        async function startAudio() {
            try {
                if (typeof RNBO === 'undefined') {
                    throw new Error('RNBO library not loaded.');
                }

                if (!audioContext) {
                    var AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioContext = new AudioContext();
                }

                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                if (!patcherData) {
                    await loadPatcher();
                }

                if (patcherData && !device) {
                    statusDiv.textContent = 'Creating device...';
                    device = await RNBO.createDevice({ context: audioContext, patcher: patcherData });

                    // Connect device to output
                    device.node.connect(audioContext.destination);

                    statusDiv.textContent = 'Audio Engine Running.';
                    startBtn.textContent = 'Audio Engine Active';
                    startBtn.disabled = true;

                    // Enable controls
                    playSampleBtn.disabled = false;
                    playOscBtn.disabled = false;
                }

            } catch (err) {
                console.error(err);
                statusDiv.textContent = 'Audio Error: ' + err.message;
            }
        }

        async function playRandomSample() {
            if (!device || !audioContext) return;

            var randomFile = SAMPLE_ASSETS[Math.floor(Math.random() * SAMPLE_ASSETS.length)];
            var url = ASSETS_URL + randomFile;

            statusDiv.textContent = `Loading sample: ${randomFile}...`;

            try {
                var buffer = await loadBuffer(url);
                // Set the buffer on the device with id "sound" (as defined in dependencies.json/export)
                await device.setDataBuffer("sound", buffer);
                statusDiv.textContent = `Playing: ${randomFile}`;
                console.log(`Loaded and set buffer: ${randomFile}`);
            } catch (err) {
                statusDiv.textContent = `Error loading ${randomFile}`;
            }
        }

        function playOscillator() {
            if (!device) return;
            console.log("Play Oscillator clicked. (Functionality depends on patch implementation)");
            statusDiv.textContent = "Play Oscillator triggered (Check console/patch)";
            // Placeholder: The current export JSON does not list parameters.
            // If the patch had a parameter named 'osc_on', we would do:
            // const param = device.parameters.find(p => p.id === 'osc_on');
            // if (param) param.value = 1;
        }

        startBtn.addEventListener('click', startAudio);
        playSampleBtn.addEventListener('click', playRandomSample);
        playOscBtn.addEventListener('click', playOscillator);

        // Check if RNBO is already loaded (if script ran before this one)
        if (typeof RNBO !== 'undefined') {
            window.initSoundArtist();
        }
    })();
    </script>

    <!-- Load RNBO Library -->
    <script type="text/javascript" src="https://cdn.cycling74.com/rnbo/1.4.2/rnbo.min.js" crossorigin="anonymous" onload="if(window.initSoundArtist) window.initSoundArtist();" onerror="if(window.rnboError) window.rnboError();"></script>
</div>
