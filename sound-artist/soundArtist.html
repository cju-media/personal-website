<div id="sound-artist-page-wrapper">
    <style>
        #sound-artist-page-wrapper {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            color: inherit;
        }
        #sound-artist-page-wrapper button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        #sound-artist-page-wrapper button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
        #sound-artist-page-wrapper button:hover:not(:disabled) {
            background-color: #555;
        }
        #sound-artist-page-wrapper #status {
            margin-top: 15px;
            font-style: italic;
        }
    </style>
    <h1>Sound Artist</h1>
    <p>RNBO Patch</p>
    <button id="start-audio" disabled>Loading Library...</button>
    <div id="status">Initializing...</div>

    <script>
    (function() {
        const wrapper = document.getElementById('sound-artist-page-wrapper');
        if (!wrapper) return;

        const startBtn = wrapper.querySelector('#start-audio');
        const statusDiv = wrapper.querySelector('#status');
        let audioContext;
        let device;
        let patcherData;

        const REPO_BASE = 'https://raw.githubusercontent.com/cju-media/personal-website/main/sound-artist/sound/rnbo-export/';

        // Exposed init function for onload callback
        window.initSoundArtist = function() {
            startBtn.textContent = 'Start Sound';
            startBtn.disabled = false;
            statusDiv.textContent = 'Library loaded. Fetching patch...';
            loadPatcher();
        };

        // Exposed error handler
        window.rnboError = function() {
            statusDiv.textContent = 'Error: Failed to load RNBO library.';
            statusDiv.style.color = 'red';
        };

        async function loadPatcher() {
            try {
                // Fetch the exported patcher from GitHub repo
                const rawUrl = REPO_BASE + 'sound-artist.export.json';

                const response = await fetch(rawUrl);
                if (!response.ok) {
                    throw new Error(`Failed to load patch: ${response.status} ${response.statusText}`);
                }
                patcherData = await response.json();
                statusDiv.textContent = 'Patch fetched. Ready to start.';
            } catch (err) {
                console.error(err);
                statusDiv.textContent = 'Fetch Error: ' + err.message;
            }
        }

        async function loadDependency(id, filename, context) {
            try {
                // Construct URL for the audio file in the repo
                // Assuming dependencies are flat in the rnbo-export folder or managed relative to it
                // Based on dependencies.json memory, the file might be absolute in the export metadata,
                // but we need to fetch it from our repo.
                // The filename in externalDataRefs is usually just the name like "anton.aif"
                const fileUrl = REPO_BASE + filename;

                const response = await fetch(fileUrl);
                if (!response.ok) {
                    throw new Error(`Failed to load dependency ${filename}: ${response.statusText}`);
                }

                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await context.decodeAudioData(arrayBuffer);

                return audioBuffer;
            } catch (err) {
                console.error(`Error loading dependency ${filename}:`, err);
                throw err;
            }
        }

        async function startAudio() {
            try {
                if (typeof RNBO === 'undefined') {
                    throw new Error('RNBO library not loaded.');
                }

                if (!audioContext) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioContext = new AudioContext();
                }

                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                if (!patcherData) {
                    await loadPatcher();
                }

                if (patcherData && !device) {
                    statusDiv.textContent = 'Creating device...';
                    device = await RNBO.createDevice({ context: audioContext, patcher: patcherData });

                    // Handle External Data Refs (Buffers)
                    if (patcherData.desc.externalDataRefs && patcherData.desc.externalDataRefs.length > 0) {
                        statusDiv.textContent = 'Loading samples...';

                        for (const ref of patcherData.desc.externalDataRefs) {
                            if (ref.type === 'Float32Buffer' || ref.tag === 'buffer~') {
                                try {
                                    // Use the 'file' property as the filename to fetch
                                    // Note: ref.file might contain a full local path from export, we only want the basename
                                    const filename = ref.file.split('/').pop();
                                    const buffer = await loadDependency(ref.id, filename, audioContext);

                                    // Set the buffer on the device
                                    await device.setDataBuffer(ref.id, buffer);
                                    console.log(`Loaded buffer: ${ref.id} from ${filename}`);
                                } catch (e) {
                                    console.warn(`Skipping buffer ${ref.id}:`, e);
                                    statusDiv.textContent += ` (Warning: failed to load ${ref.id})`;
                                }
                            }
                        }
                    }

                    // Connect device to output
                    device.node.connect(audioContext.destination);

                    statusDiv.textContent = 'Audio running.';
                    startBtn.textContent = 'Audio Active';
                    startBtn.disabled = true;
                }

            } catch (err) {
                console.error(err);
                statusDiv.textContent = 'Audio Error: ' + err.message;
            }
        }

        startBtn.addEventListener('click', startAudio);

        // Check if RNBO is already loaded (if script ran before this one)
        if (typeof RNBO !== 'undefined') {
            window.initSoundArtist();
        }
    })();
    </script>

    <!-- Load RNBO Library -->
    <script type="text/javascript" src="https://cdn.cycling74.com/rnbo/1.4.2/rnbo.min.js" crossorigin="anonymous" onload="if(window.initSoundArtist) window.initSoundArtist();" onerror="if(window.rnboError) window.rnboError();"></script>
</div>
