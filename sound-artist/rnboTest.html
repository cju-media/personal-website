<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNBO Web Player - Sound Artist</title>
    <script src="https://cdn.cycling74.com/rnbo/latest/rnbo.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #121212; color: white; margin: 0; }
        .card { background: #1e1e1e; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; border: 1px solid #333; }
        h1 { margin-bottom: 0.5rem; font-weight: 300; letter-spacing: 1px; }
        button { padding: 12px 24px; font-size: 1.1rem; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 6px; transition: background 0.2s; }
        button:hover:not(:disabled) { background: #0056b3; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        #status { margin-top: 1.5rem; font-family: monospace; font-size: 0.85rem; color: #aaa; }
    </style>
</head>
<body>

    <div class="card">
        <h1>RNBO Engine</h1>
        <p style="color: #888; margin-bottom: 2rem;">Sound Artist Export</p>
        <button id="start-btn" disabled>Loading Patch...</button>
        <div id="status">Initializing...</div>
    </div>

    <script>
        const PATCH_URL = "https://raw.githubusercontent.com/cju-media/personal-website/37b6a3325ec1c5c41a9ac9bf7c519fa4f31bed9d/sound-artist/sound/rnbo-export/sound-artist.export.json"; 
        
        let context;
        let device;

        async function init() {
            const statusText = document.getElementById("status");
            const startBtn = document.getElementById("start-btn");

            // Double check that RNBO is actually loaded
            if (typeof RNBO === "undefined") {
                statusText.innerText = "Error: RNBO library not loaded from CDN.";
                return;
            }

            try {
                const WAContext = window.AudioContext || window.webkitAudioContext;
                context = new WAContext();

                statusText.innerText = "Downloading patch from GitHub...";
                const response = await fetch(PATCH_URL);
                if (!response.ok) throw new Error("Could not fetch the patch file.");
                const patcher = await response.json();

                statusText.innerText = "Instantiating RNBO device...";
                device = await RNBO.createDevice({ context, patcher });

                device.node.connect(context.destination);

                statusText.innerText = "Patch loaded successfully.";
                startBtn.disabled = false;
                startBtn.innerText = "Start Audio";

                startBtn.onclick = async () => {
                    if (context.state === 'suspended') {
                        await context.resume();
                    }
                    
                    if (startBtn.innerText === "Start Audio") {
                        startBtn.innerText = "Audio Running";
                        startBtn.style.background = "#28a745";
                        statusText.innerText = "Playing...";
                    }
                };

            } catch (err) {
                console.error(err);
                statusText.innerText = "Error loading patch. Check the console.";
                statusText.style.color = "#ff4d4d";
            }
        }

        // FIX: Wait for the window to finish loading (including the CDN script) 
        // before running the init function.
        window.addEventListener("load", init);
    </script>
</body>
</html>
