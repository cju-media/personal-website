<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>RNBO Web Player - Dual Axis Control</title>
    <script src="https://cdn.cycling74.com/rnbo/latest/rnbo.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #121212; color: white; margin: 0; overflow: hidden; }
        .card { background: #1e1e1e; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; border: 1px solid #333; width: 340px; z-index: 10; }
        h1 { margin-bottom: 0.5rem; font-weight: 300; letter-spacing: 1px; }
        
        .display-container { display: flex; gap: 10px; margin: 1.5rem 0; }
        .readout { flex: 1; background: #000; border: 1px solid #007bff; border-radius: 4px; padding: 10px; font-family: 'Courier New', Courier, monospace; }
        .label { color: #888; font-size: 0.6rem; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }
        .val { color: #007bff; font-size: 1.2rem; font-weight: bold; }

        button { width: 100%; padding: 14px; font-size: 1.1rem; font-weight: 600; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 6px; transition: all 0.2s; }
        button:hover:not(:disabled) { background: #0056b3; transform: translateY(-1px); }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        #status { margin-top: 1.5rem; font-family: monospace; font-size: 0.8rem; color: #666; min-height: 1.2em; }
    </style>
</head>
<body>

    <div class="card">
        <h1>RNBO Engine</h1>
        <div class="display-container">
            <div class="readout">
                <div class="label">X: Freq</div>
                <div id="freq-val" class="val">---</div>
            </div>
            <div class="readout">
                <div class="label">Y: Param</div>
                <div id="param-val" class="val">---</div>
            </div>
        </div>
        <button id="start-btn" disabled>Scanning Assets...</button>
        <div id="status">Ready</div>
    </div>

    <script>
        const REPO_API_URL = "https://api.github.com/repos/cju-media/personal-website/contents/sound-artist/sound/assets";
        const PATCH_URL = "https://raw.githubusercontent.com/cju-media/personal-website/main/sound-artist/sound/rnbo-export/sound-artist.export.json";

        let context, device, isRunning = false;
        let selectedAudioURL = "", selectedFileName = "";

        async function init() {
            const statusText = document.getElementById("status");
            const startBtn = document.getElementById("start-btn");
            const freqValDisplay = document.getElementById("freq-val");
            const paramValDisplay = document.getElementById("param-val");

            try {
                const WAContext = window.AudioContext || window.webkitAudioContext;
                context = new WAContext();
                const cacheBuster = `?t=${new Date().getTime()}`;

                const apiResponse = await fetch(REPO_API_URL);
                const files = await apiResponse.json();
                const audioFiles = files.filter(f => f.name.match(/\.(aiff|wav|mp3)$/i));
                
                const choice = audioFiles[Math.floor(Math.random() * audioFiles.length)];
                selectedAudioURL = choice.download_url + cacheBuster;
                selectedFileName = choice.name;

                const patchResponse = await fetch(PATCH_URL + cacheBuster);
                const patcher = await patchResponse.json();
                device = await RNBO.createDevice({ context, patcher });
                device.node.connect(context.destination);

                statusText.innerText = `Selected: ${selectedFileName}`;
                startBtn.disabled = false;
                startBtn.innerText = "Start Audio";

                const freqParam = device.parametersById.get("freq");
                const yParam = device.parametersById.get("param"); // Accessing "param"

                window.addEventListener('mousemove', (e) => {
                    if (!isRunning) return;

                    // X-AXIS: Freq (100 to 1000)
                    if (freqParam) {
                        const xPercent = e.clientX / window.innerWidth;
                        const freqValue = 100 + (xPercent * 900);
                        freqParam.value = freqValue;
                        freqValDisplay.innerText = Math.round(freqValue) + "Hz";
                    }

                    // Y-AXIS: Param (Bottom: 0.1 to Top: 4)
                    if (yParam) {
                        // Invert Y: (1.0 at top, 0.0 at bottom)
                        const yPercent = 1 - (e.clientY / window.innerHeight);
                        const paramValue = 0.1 + (yPercent * (4 - 0.1));
                        yParam.value = paramValue;
                        paramValDisplay.innerText = paramValue.toFixed(2);
                    }
                });

                startBtn.onclick = async () => {
                    if (context.state === 'suspended') await context.resume();
                    
                    statusText.innerText = "Loading audio...";
                    startBtn.disabled = true;

                    const fileResponse = await fetch(selectedAudioURL);
                    const arrayBuffer = await fileResponse.arrayBuffer();
                    const audioBuffer = await context.decodeAudioData(arrayBuffer);

                    // Map decoded buffer to "sound"
                    await device.setDataBuffer("sound", audioBuffer);

                    isRunning = true;
                    startBtn.disabled = false;
                    startBtn.innerText = "Audio Running";
                    startBtn.style.background = "#28a745";
                    statusText.innerText = `Playing: ${selectedFileName}`;
                };

            } catch (err) {
                console.error(err);
                statusText.innerText = "Init failed.";
            }
        }

        window.addEventListener("load", init);
    </script>
</body>
</html>
