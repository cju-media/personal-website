<style>
    /* Force the Squarespace container to allow full-screen breakout */
    .sqs-block-code .sqs-block-content {
        position: static !important;
    }

    #pond-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #05070a;
        z-index: 9999; 
        overflow: hidden;
        /* Prevent mobile "pull-to-refresh" */
        touch-action: none;
    }

    #back-button {
        position: absolute;
        top: 30px;
        left: 30px;
        z-index: 10002;
        color: #1e3a8a;
        font-family: monospace;
        text-decoration: none;
        letter-spacing: 3px;
        font-size: 0.8rem;
        padding: 10px;
        border: 1px solid transparent;
        transition: all 0.5s ease;
        opacity: 0;
        pointer-events: none;
    }

    #back-button.visible {
        opacity: 0.6;
        pointer-events: auto;
    }

    #back-button:hover {
        color: #3b82f6;
        border: 1px solid #1e3a8a;
        opacity: 1;
    }

    #pondCanvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    #focus-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        display: flex;
        flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 10000;
        cursor: pointer;
        transition: opacity 2s ease;
        visibility: hidden;
        opacity: 0;
    }
    
    #focus-text { 
        font-family: monospace;
        letter-spacing: 0.8em;
        color: #3b82f6; 
        font-size: 1rem;
        border: 1px solid #1e3a8a;
        padding: 20px 40px;
        text-transform: uppercase;
        pointer-events: none;
        text-align: center;
    }

    #loading-indicator {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10001;
        font-family: monospace; 
        color: #1e3a8a;
        font-size: 0.8rem;
        letter-spacing: 2px;
        pointer-events: none;
    }
</style>

<div id="pond-wrapper">
    <a href="/" id="back-button">< BACK</a>
    <div id="loading-indicator">INITIALIZING POND...</div>
    <div id="focus-overlay">
        <div id="focus-text">TAP TO FOCUS</div>
    </div>
    <canvas id="pondCanvas"></canvas>
</div>

<script>
    (function() {
        const REPO_API_URL = "https://api.github.com/repos/cju-media/personal-website/contents/sound-artist/sound/assets";
        const PATCH_URL = "https://raw.githubusercontent.com/cju-media/personal-website/main/sound-artist/sound/rnbo-export/sound-artist.export.json";

        let context, device, isRunning = false;
        let freqParam, sampParam;

        const canvas = document.getElementById('pondCanvas');
        const ctx = canvas.getContext('2d');
        let ripples = [];
        let maxDiagonal = 0;
        let mouseX = -1000, mouseY = -1000;

        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            maxDiagonal = Math.sqrt(canvas.width**2 + canvas.height**2);
        }

        window.addEventListener('resize', setCanvasSize);
        setCanvasSize();

        class Ripple {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.r = 0;
                this.opacity = 0.4;
            }
            update() {
                this.r += 2.5;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(59, 130, 246, ${this.opacity})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        function drawWaves() {
            const time = performance.now() * 0.001;
            const waveCount = 8; // Number of horizontal lines
            const spacing = canvas.height / (waveCount + 1);

            ctx.lineWidth = 1.5;
            ctx.strokeStyle = 'rgba(59, 130, 246, 0.25)'; // Subtle blue

            for (let i = 0; i < waveCount; i++) {
                ctx.beginPath();
                const baseY = spacing * (i + 1);

                // Draw line across width
                for (let x = 0; x <= canvas.width; x += 5) {
                    // Base sine wave traveling left to right (-time)
                    let y = baseY + Math.sin(x * 0.01 - time * 2 + i) * 15;

                    // Mouse interaction
                    const dist = Math.hypot(x - mouseX, y - mouseY);
                    const influenceRadius = 200;

                    if (dist < influenceRadius) {
                        const power = (influenceRadius - dist) / influenceRadius;
                        // Add disruption: noise/jitter or just offset
                        // Let's add a secondary higher frequency wave based on mouse proximity
                        y += Math.sin(x * 0.1 + time * 10) * 30 * power;
                        // And pull towards mouse slightly? Or push away?
                        // y += (mouseY - y) * 0.1 * power; // Attract
                    }

                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 7, 10, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawWaves();

            for (let i = ripples.length - 1; i >= 0; i--) {
                ripples[i].update();
                ripples[i].draw();
                if (ripples[i].r > maxDiagonal) ripples.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }
        animate();

        // SHARED INPUT HANDLER (Touch & Mouse)
        function handleInteraction(clientX, clientY) {
            mouseX = clientX;
            mouseY = clientY;

            if (!isRunning) return;

            if (Math.random() > 0.85) ripples.push(new Ripple(clientX, clientY));

            if (freqParam) freqParam.value = 100 + ((clientX / window.innerWidth) * 900);
            if (sampParam) {
                const yPercent = 1 - (clientY / window.innerHeight);
                sampParam.value = 0.1 + (yPercent * 3.9);
            }
        }

        async function init() {
            const loading = document.getElementById('loading-indicator');
            const overlay = document.getElementById('focus-overlay');
            const backBtn = document.getElementById('back-button');

            try {
                if (typeof RNBO === "undefined") {
                    setTimeout(init, 100);
                    return;
                }

                const WAContext = window.AudioContext || window.webkitAudioContext;
                context = new WAContext();
                const cacheBuster = `?t=${new Date().getTime()}`;

                const apiResponse = await fetch(REPO_API_URL);
                const files = await apiResponse.json();
                const audioFiles = files.filter(f => f.name.match(/\.(aiff|wav|mp3)$/i));
                const choice = audioFiles[Math.floor(Math.random() * audioFiles.length)];

                const patchResponse = await fetch(PATCH_URL + cacheBuster);
                const patcher = await patchResponse.json();
                device = await RNBO.createDevice({ context, patcher });
                device.node.connect(context.destination);

                const fileResponse = await fetch(choice.download_url + cacheBuster);
                const arrayBuffer = await fileResponse.arrayBuffer();
                const audioBuffer = await context.decodeAudioData(arrayBuffer);
                await device.setDataBuffer("sound", audioBuffer);

                freqParam = device.parametersById.get("freq");
                sampParam = device.parametersById.get("sampRate");

                loading.style.display = 'none';
                overlay.style.visibility = 'visible';
                overlay.style.opacity = '1';

                // Handle both Click and Touch to start audio
                const startAudio = async () => {
                    if (context.state === 'suspended') await context.resume();
                    isRunning = true;
                    overlay.style.opacity = '0';
                    setTimeout(() => {
                        overlay.style.visibility = 'hidden';
                        backBtn.classList.add('visible');
                    }, 2000);
                };

                overlay.addEventListener('click', startAudio);
                overlay.addEventListener('touchstart', startAudio);

                // MOUSE SUPPORT
                window.addEventListener('mousemove', (e) => handleInteraction(e.clientX, e.clientY));

                // MOBILE SUPPORT: Touch tracking
                window.addEventListener('touchmove', (e) => {
                    if (e.touches.length > 0) {
                        handleInteraction(e.touches[0].clientX, e.touches[0].clientY);
                    }
                }, { passive: false });

            } catch (err) {
                console.error("Pond Init Error:", err);
                loading.innerText = "ERROR LOADING POND";
            }
        }

        if (document.readyState === "complete" || document.readyState === "interactive") {
            init();
        } else {
            document.addEventListener("DOMContentLoaded", init);
        }
    })();
</script>
