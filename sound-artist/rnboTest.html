<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Pond - Sound Artist</title>
    <script src="https://cdn.cycling74.com/rnbo/latest/rnbo.min.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #05070a; 
            display: flex; align-items: center; justify-content: center;
        }
        /* Canvas scales to fill the entire viewport */
        canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        #focus-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; cursor: pointer; transition: opacity 2s ease;
            visibility: hidden; opacity: 0;
        }
        
        #focus-text { 
            font-family: monospace; letter-spacing: 0.8em; color: #3b82f6; 
            font-size: 1rem; border: 1px solid #1e3a8a; padding: 20px 40px;
            text-transform: uppercase;
        }

        #loading-indicator {
            position: fixed; z-index: 101; font-family: monospace; 
            color: #1e3a8a; font-size: 0.8rem; letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="loading-indicator">INITIALIZING POND...</div>

    <div id="focus-overlay">
        <div id="focus-text">CLICK TO FOCUS</div>
    </div>

    <canvas id="pondCanvas"></canvas>

    <script>
        const REPO_API_URL = "https://api.github.com/repos/cju-media/personal-website/contents/sound-artist/sound/assets";
        const PATCH_URL = "https://raw.githubusercontent.com/cju-media/personal-website/main/sound-artist/sound/rnbo-export/sound-artist.export.json";

        let context, device, isRunning = false;
        let freqParam, sampParam;

        // --- CANVAS SCALING & RIPPLES ---
        const canvas = document.getElementById('pondCanvas');
        const ctx = canvas.getContext('2d');
        let ripples = [];

        function setCanvasSize() {
            // Scale internal resolution to match display size
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', setCanvasSize);
        setCanvasSize();

        class Ripple {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.r = 0; this.opacity = 0.6;
            }
            update() {
                this.r += 2.0;
                this.opacity -= 0.007;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(59, 130, 246, ${this.opacity})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 7, 10, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = ripples.length - 1; i >= 0; i--) {
                ripples[i].update();
                ripples[i].draw();
                if (ripples[i].opacity <= 0) ripples.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }
        animate();

        // --- RNBO & ASSET LOADING ---
        async function init() {
            const loading = document.getElementById('loading-indicator');
            const overlay = document.getElementById('focus-overlay');

            try {
                const WAContext = window.AudioContext || window.webkitAudioContext;
                context = new WAContext();
                const cacheBuster = `?t=${new Date().getTime()}`;

                // 1. Fetch assets via GitHub API
                const apiResponse = await fetch(REPO_API_URL);
                const files = await apiResponse.json();
                const audioFiles = files.filter(f => f.name.match(/\.(aiff|wav|mp3)$/i));
                const choice = audioFiles[Math.floor(Math.random() * audioFiles.length)];

                // 2. Load RNBO Device
                const patchResponse = await fetch(PATCH_URL + cacheBuster);
                const patcher = await patchResponse.json();
                device = await RNBO.createDevice({ context, patcher });
                device.node.connect(context.destination);

                // 3. Load & Decode Audio into Buffer
                const fileResponse = await fetch(choice.download_url + cacheBuster);
                const arrayBuffer = await fileResponse.arrayBuffer();
                const audioBuffer = await context.decodeAudioData(arrayBuffer);
                await device.setDataBuffer("sound", audioBuffer);

                freqParam = device.parametersById.get("freq");
                sampParam = device.parametersById.get("sampRate");

                loading.style.display = 'none';
                overlay.style.visibility = 'visible';
                overlay.style.opacity = '1';

                overlay.onclick = async () => {
                    if (context.state === 'suspended') await context.resume();
                    isRunning = true;
                    overlay.style.opacity = '0';
                    setTimeout(() => overlay.style.visibility = 'hidden', 2000);
                };

                // --- SCALED MOUSE TRACKING ---
                window.addEventListener('mousemove', (e) => {
                    if (!isRunning) return;

                    // Get mouse position relative to canvas
                    const rect = canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    // Create ripple at canvas coordinates
                    if (Math.random() > 0.85) {
                        ripples.push(new Ripple(x, y));
                    }

                    // Map to DSP Parameters
                    if (freqParam) {
                        const freqVal = 100 + ((x / canvas.width) * 900);
                        freqParam.value = freqVal;
                    }
                    if (sampParam) {
                        const yPercent = 1 - (y / canvas.height);
                        const sampVal = 0.1 + (yPercent * 3.9);
                        sampParam.value = sampVal;
                    }
                });

            } catch (err) {
                console.error(err);
                loading.innerText = "ERROR LOADING SYSTEM";
            }
        }

        window.addEventListener("load", init);
    </script>
</body>
</html>
