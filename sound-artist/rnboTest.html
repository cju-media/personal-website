<style>
    /* Force the Squarespace container to allow full-screen breakout */
    .sqs-block-code .sqs-block-content {
        position: static !important;
    }

    #pond-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #3b82f6; /* Blue background */
        z-index: 9999; 
        overflow: hidden;
        touch-action: none;
    }

    #back-button {
        position: absolute;
        top: 30px;
        left: 30px;
        z-index: 10002;
        color: rgba(255, 255, 255, 0.7); 
        font-family: monospace;
        text-decoration: none;
        letter-spacing: 3px;
        font-size: 0.8rem;
        padding: 10px;
        border: 1px solid transparent;
        transition: all 0.5s ease;
        opacity: 0;
        pointer-events: none;
    }

    #back-button.visible {
        opacity: 0.6;
        pointer-events: auto;
    }

    #back-button:hover {
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.7);
        opacity: 1;
    }

    #pondCanvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    #focus-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(59, 130, 246, 0.95);
        display: flex;
        flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 10000;
        cursor: pointer;
        transition: opacity 2s ease;
        visibility: hidden;
        opacity: 0;
    }
    
    #focus-text { 
        font-family: monospace;
        letter-spacing: 0.8em;
        color: rgba(255, 255, 255, 0.7);
        font-size: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.7);
        padding: 20px 40px;
        text-transform: uppercase;
        pointer-events: none;
        text-align: center;
    }

    #loading-indicator {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10001;
        font-family: monospace; 
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.8rem;
        letter-spacing: 2px;
        pointer-events: none;
    }

    #dev-bypass {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 20000;
        background: transparent;
        color: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 5px 10px;
        font-family: monospace;
        font-size: 12px;
        cursor: pointer;
        border-radius: 4px;
        transition: opacity 0.3s;
    }
</style>

<div id="pond-wrapper">
    <a href="/" id="back-button">< BACK</a>
    <div id="loading-indicator">INITIALIZING POND...</div>
    <div id="focus-overlay">
        <div id="focus-text">TAP TO FOCUS</div>
    </div>
    <button id="dev-bypass">DEV MODE</button>
    <canvas id="pondCanvas"></canvas>
</div>

<!-- Load RNBO Library -->
<script type="text/javascript" src="https://cdn.cycling74.com/rnbo/1.4.2/rnbo.min.js"></script>

<script>
(function() {
    console.log("RNBO Test Script Loaded");
    const REPO_ROOT = "https://raw.githubusercontent.com/cju-media/personal-website/main/sound-artist/sound/";
    const ASSETS_URL = REPO_ROOT + "assets/";
    const PATCH_URL = REPO_ROOT + "rnbo-export/sound-artist.export.json";

    const SAMPLE_ASSETS = [
        "epno.aiff",
        "eroica.aiff",
        "isthatyou.aiff",
        "sacre.aiff",
        "snare.aiff"
    ];

    let context, device, isRunning = false;
    let freqParam, sampParam;
    let devMode = false;

    const canvas = document.getElementById('pondCanvas');
    const ctx = canvas.getContext('2d');
    let ripples = [];
    let maxDiagonal = 0;

    let currentX = 0, currentY = 0;
    let lastRippleTime = 0; 
    let lastTouchTime = 0;

    const ambientAmp = 12; 
    // Subtle power (10% scale relative to the 'huge' displacement)
    const rippleMaxPower = ambientAmp * 1.1; 

    function setCanvasSize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        maxDiagonal = Math.sqrt(canvas.width**2 + canvas.height**2);
    }
    window.addEventListener('resize', setCanvasSize);
    setCanvasSize();

    class Ripple {
        constructor(x, y) {
            this.x = x; 
            this.y = y;
            this.radius = 0;
            this.strength = 0; 
            this.maxReached = false;
            this.velocity = 2.5; 
        }
        update() {
            this.radius += this.velocity;
            if (!this.maxReached) {
                this.strength += 0.2; // Quick ramp up
                if (this.strength >= 1.0) {
                    this.strength = 1.0;
                    this.maxReached = true;
                }
            } else {
                this.strength *= 0.992; 
            }
        }
    }

    function drawWaves() {
        const time = performance.now() * 0.001;
        const waveCount = 12; 
        const spacing = canvas.height / (waveCount + 1);

        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; 

        for (let i = 0; i < waveCount; i++) {
            ctx.beginPath();
            const baseY = spacing * (i + 1);

            for (let x = 0; x <= canvas.width; x += 5) {
                let yOffset = Math.sin(x * 0.01 - time * 2 + i) * ambientAmp;

                for (let j = 0; j < ripples.length; j++) {
                    const r = ripples[j];
                    const dx = x - r.x;
                    const dy = baseY - r.y; 
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    const distFromWavefront = distance - r.radius;
                    const waveWidth = 120; 

                    if (Math.abs(distFromWavefront) < waveWidth) {
                        const normalized = distFromWavefront / waveWidth; 
                        const envelope = (Math.cos(normalized * Math.PI) + 1) / 2;
                        
                        // DIRECTIONAL PUSH: Moves away from mouse center
                        const direction = dy < 0 ? -1 : 1;
                        
                        yOffset += (envelope * rippleMaxPower * r.strength) * direction;
                    }
                }

                const finalY = baseY + yOffset;
                if (x === 0) ctx.moveTo(x, finalY);
                else ctx.lineTo(x, finalY);
            }
            ctx.stroke();
        }
    }

    function animate() {
        ctx.fillStyle = 'rgba(59, 130, 246, 0.4)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawWaves();

        for (let i = ripples.length - 1; i >= 0; i--) {
            ripples[i].update();
            if (ripples[i].strength < 0.01 || ripples[i].radius > maxDiagonal) {
                ripples.splice(i, 1);
            }
        }
        requestAnimationFrame(animate);
    }

    function handleInteraction(clientX, clientY) {
        currentX = clientX;
        currentY = clientY;

        if (isRunning) {
            const now = Date.now();
            // POLLING: New ripple every 0.1 seconds (100ms)
            if (now - lastRippleTime > 100) {
                ripples.push(new Ripple(currentX, currentY));
                lastRippleTime = now;
            }

            if (!devMode && freqParam) freqParam.value = 100 + ((clientX / window.innerWidth) * 900);
            if (!devMode && sampParam) {
                const yPercent = 1 - (clientY / window.innerHeight);
                sampParam.value = 0.1 + (yPercent * 3.9);
            }
        }
    }

    async function init() {
        const loading = document.getElementById('loading-indicator');
        const overlay = document.getElementById('focus-overlay');
        const devBtn = document.getElementById('dev-bypass');

        devBtn.addEventListener('click', () => {
            devMode = true;
            loading.style.display = 'none';
            overlay.style.visibility = 'visible';
            overlay.style.opacity = '1';
        });

        async function setupRNBO() {
            if (devMode) return;
            try {
                console.log("Setting up RNBO...");

                // Use a shared context if possible to avoid context limit exhaustion
                const WAContext = window.AudioContext || window.webkitAudioContext;
                // Reuse existing context or create a new one, but always assign to window property
                // so it persists across re-injections of this block.
                if (!window.RNBO_AudioContext) {
                    console.log("Creating new AudioContext");
                    window.RNBO_AudioContext = new WAContext();
                } else {
                    console.log("Reusing existing AudioContext");
                    // If the previous context was closed (unlikely but possible), create new
                    if (window.RNBO_AudioContext.state === 'closed') {
                         console.log("Previous context closed. Creating new.");
                         window.RNBO_AudioContext = new WAContext();
                    }
                }
                context = window.RNBO_AudioContext;

                console.log("AudioContext State:", context.state);

                console.log("Fetching patch:", PATCH_URL);
                const patchResponse = await fetch(PATCH_URL);
                if (!patchResponse.ok) throw new Error(`Failed to fetch patch: ${patchResponse.statusText}`);
                const patcher = await patchResponse.json();

                console.log("Creating RNBO device...");
                device = await RNBO.createDevice({ context, patcher });
                device.node.connect(context.destination);
                console.log("Device created.");

                const randomFile = SAMPLE_ASSETS[Math.floor(Math.random() * SAMPLE_ASSETS.length)];
                const fileUrl = ASSETS_URL + randomFile;
                console.log("Fetching audio file:", fileUrl);

                const fileResponse = await fetch(fileUrl);
                if (!fileResponse.ok) throw new Error(`Failed to fetch audio file: ${fileResponse.statusText}`);
                
                const arrayBuffer = await fileResponse.arrayBuffer();
                console.log("Decoding audio data...");
                const audioBuffer = await context.decodeAudioData(arrayBuffer);
                await device.setDataBuffer("sound", audioBuffer);
                console.log("Audio buffer set.");

                freqParam = device.parametersById.get("freq");
                sampParam = device.parametersById.get("sampRate");

                loading.style.display = 'none';
                overlay.style.visibility = 'visible';
                overlay.style.opacity = '1';
                console.log("RNBO Setup Complete. Ready for interaction.");
            } catch (e) {
                console.error("RNBO Setup Failed:", e);
                if (e.name === 'EncodingError') {
                    loading.innerText = "AUDIO DECODE ERROR";
                } else if (e.name === 'TypeError' || e.message.includes('fetch')) {
                    loading.innerText = "AUDIO FETCH ERROR";
                } else {
                    loading.innerText = "AUDIO LOAD ERROR";
                }
            }
        }

        if (typeof RNBO !== "undefined") {
            console.log("RNBO found immediately.");
            setupRNBO();
        } else {
            console.log("Waiting for RNBO...");
            const check = setInterval(() => {
                if (typeof RNBO !== "undefined") {
                    console.log("RNBO loaded via interval.");
                    setupRNBO();
                    clearInterval(check);
                }
            }, 100);
        }

        overlay.addEventListener('mousedown', (e) => {
            console.log("Interaction started. Resuming AudioContext...");
            if (context && context.state === 'suspended') {
                context.resume().then(() => {
                    console.log("AudioContext resumed.");
                });
            }
            isRunning = true;
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.visibility = 'hidden', 1000);
            handleInteraction(e.clientX, e.clientY);
        });

        window.addEventListener('mousemove', (e) => {
            if (Date.now() - lastTouchTime < 1000) return;
            handleInteraction(e.clientX, e.clientY);
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                e.preventDefault();
                lastTouchTime = Date.now();
                handleInteraction(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });
    }

    requestAnimationFrame(animate);
    init();
})();
</script>
