<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>RNBO Web Player - Click to Focus</title>
    <script src="https://cdn.cycling74.com/rnbo/latest/rnbo.min.js"></script>
    <style>
        :root { --accent: #007bff; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #000; color: white; margin: 0; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        /* The Blur Overlay */
        #focus-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; cursor: pointer; transition: opacity 1s ease, visibility 1s;
        }
        
        #focus-text { font-family: monospace; letter-spacing: 0.5em; color: var(--accent); font-size: 1.2rem; transition: letter-spacing 0.5s; }
        #focus-overlay:hover #focus-text { letter-spacing: 0.8em; color: white; }

        /* The Content (Starts blurry/hidden behind overlay) */
        .card { text-align: center; width: 340px; }
        .display-container { display: flex; gap: 10px; margin: 1.5rem 0; }
        .readout { flex: 1; background: #111; border: 1px solid #333; border-radius: 4px; padding: 10px; font-family: monospace; }
        .label { color: #555; font-size: 0.6rem; text-transform: uppercase; margin-bottom: 5px; }
        .val { color: var(--accent); font-size: 1.2rem; font-weight: bold; }
        #status { font-family: monospace; font-size: 0.7rem; color: #444; }
    </style>
</head>
<body>

    <div id="focus-overlay">
        <div id="focus-text">CLICK TO FOCUS</div>
        <div id="status" style="margin-top: 20px;">Scanning assets...</div>
    </div>

    <div class="card">
        <h1 style="font-weight: 200; letter-spacing: 3px;">SYSTEM ACTIVE</h1>
        <div class="display-container">
            <div class="readout">
                <div class="label">X: Freq</div>
                <div id="freq-val" class="val">---</div>
            </div>
            <div class="readout">
                <div class="label">Y: SampRate</div>
                <div id="samp-val" class="val">---</div>
            </div>
        </div>
    </div>

    <script>
        const REPO_API_URL = "https://api.github.com/repos/cju-media/personal-website/contents/sound-artist/sound/assets";
        const PATCH_URL = "https://raw.githubusercontent.com/cju-media/personal-website/main/sound-artist/sound/rnbo-export/sound-artist.export.json";

        let context, device, isRunning = false;
        let selectedAudioURL = "", selectedFileName = "";

        async function init() {
            const statusText = document.getElementById("status");
            const overlay = document.getElementById("focus-overlay");
            const freqValDisplay = document.getElementById("freq-val");
            const sampValDisplay = document.getElementById("samp-val");

            try {
                const WAContext = window.AudioContext || window.webkitAudioContext;
                context = new WAContext();
                const cacheBuster = `?t=${new Date().getTime()}`;

                // 1. Scan Assets
                const apiResponse = await fetch(REPO_API_URL);
                const files = await apiResponse.json();
                const audioFiles = files.filter(f => f.name.match(/\.(aiff|wav|mp3)$/i));
                const choice = audioFiles[Math.floor(Math.random() * audioFiles.length)];
                selectedAudioURL = choice.download_url + cacheBuster;
                selectedFileName = choice.name;

                // 2. Load RNBO Device
                const patchResponse = await fetch(PATCH_URL + cacheBuster);
                const patcher = await patchResponse.json();
                device = await RNBO.createDevice({ context, patcher });
                device.node.connect(context.destination);

                statusText.innerText = "Ready to engage.";

                // 3. Mouse Logic
                const freqParam = device.parametersById.get("freq");
                const sampParam = device.parametersById.get("sampRate");

                window.addEventListener('mousemove', (e) => {
                    if (!isRunning) return;
                    
                    if (freqParam) {
                        const xValue = 100 + ((e.clientX / window.innerWidth) * 900);
                        freqParam.value = xValue;
                        freqValDisplay.innerText = Math.round(xValue) + "Hz";
                    }
                    if (sampParam) {
                        const yPercent = 1 - (e.clientY / window.innerHeight);
                        const yValue = 0.1 + (yPercent * 3.9);
                        sampParam.value = yValue;
                        sampValDisplay.innerText = yValue.toFixed(2);
                    }
                });

                // 4. Click to Focus Logic
                overlay.onclick = async () => {
                    if (context.state === 'suspended') await context.resume();
                    
                    statusText.innerText = `Engaging ${selectedFileName}...`;
                    
                    // Fetch and decode chosen file
                    const fileResponse = await fetch(selectedAudioURL);
                    const arrayBuffer = await fileResponse.arrayBuffer();
                    const audioBuffer = await context.decodeAudioData(arrayBuffer);

                    // Set decoded data to "sound" buffer
                    await device.setDataBuffer("sound", audioBuffer);

                    isRunning = true;
                    overlay.style.opacity = "0";
                    setTimeout(() => overlay.style.visibility = "hidden", 1000);
                };

            } catch (err) {
                console.error(err);
                statusText.innerText = "Initialization failed.";
            }
        }

        window.addEventListener("load", init);
    </script>
</body>
</html>
