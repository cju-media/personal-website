<style>
    .video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }

    .video-item {
        position: relative;
        width: 100%;
        padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
        background: #000;
        overflow: hidden;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .video-item video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
</style>

<div id="video-grid-container" class="video-grid">
    <!-- Videos will be injected here -->
</div>

<script>
    (function() {
        // Shared Media Loader
        function loadMedia() {
            const url = "https://raw.githubusercontent.com/cju-media/personal-website/main/assets/media.json?t=" + Date.now();
            return fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("Network response was not ok");
                    return response.json();
                })
                .catch(error => {
                    console.error("Failed to fetch media.json:", error);
                    return null;
                });
        }

        function shuffleArray(array) {
            // Fisher-Yates shuffle (Urn Random)
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initVideoArt() {
            loadMedia().then(mediaData => {
                if (!mediaData || !mediaData.artVids) return;

                // Create a copy to shuffle and deduplicate
                const artVids = [...new Set(mediaData.artVids)];

                // Urn Random: Shuffle the array to ensure no duplicates are displayed
                shuffleArray(artVids);

                const container = document.getElementById('video-grid-container');
                if (!container) return;

                container.innerHTML = '';

                artVids.forEach(videoUrl => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'video-item';

                    const video = document.createElement('video');
                    video.src = videoUrl;
                    video.controls = true;
                    video.playsInline = true;
                    // video.loop = true;

                    wrapper.appendChild(video);
                    container.appendChild(wrapper);
                });
            });
        }

        // Initialize
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initVideoArt);
        } else {
            initVideoArt();
        }
    })();
</script>
